<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">  <!-- OSW: resolves assets/, json_files/, css/ from src/ whether run in the app or opened from src/tools/ -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="js/oswClient.js"></script>  <!-- OSW: bridge to the shell (library save/load) -->
<link rel="stylesheet" href="assets/css/rigStyles.css">
<title>Rig Lab — Character Art</title>


</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <button class="btn" id="play" title="Space">⏸</button>
  <button class="btn" id="prev" title="← previous key pose">⏮</button>
  <button class="btn" id="next" title="→ next key pose">⏭</button>
  <span class="sep"></span>
  <select id="cycle"><option value="run">Run</option><option value="walk">Walk</option></select>
  <select id="speed" title="Speed scale"></select>
  <select id="pose" title="Jump to key pose"></select>
  <input type="range" id="scrub" min="0" max="1000" value="0" title="Scrub cycle">
  <span class="sep"></span>
  <button class="btn" id="reset">Reset</button>
  <span class="sep"></span>
  <button class="btn" id="cfgExport" title="Download the current slider values, grids and pivots as rig_config.json">⬇ Export</button>
  <button class="btn" id="cfgImport" title="Load a rig_config.json (no server needed)">⬆ Import</button>
  <input type="file" id="cfgFile" accept=".json,application/json" hidden>
</div>
<div id="hud"></div>

<script>
/* ======================================================================
   RIG LAB — stick-figure rig + run/walk cycle
   Side view, character faces +x (right). Angles are degrees from the
   straight-down vertical; positive = forward. Screen y points down.
   ====================================================================== */
const R2D = Math.PI / 180, FPS = 24;
/* ======================= CHARACTER ART =======================
   SHEET_URL (assets/images/body_parts.png) is a sheet of ten 800x800 frames, each part drawn IN PLACE on the mannequin:
   head, chest, pelvis, upperArm, forearm, handR, handL, thigh, calf, shoe.
   The page loads that file on start (so redrawing the sheet updates the rig); it must be served over http.
   Pivots are positions inside the 800x800 frame, measured from the mannequin's gray joint circles; the rig maps each
   part's own pivot-to-pivot axis onto the matching skeleton bone (rotating and stretching it along the bone). */
const SHEET_URL='assets/images/body_parts.png';   // the head frame is the hooded head; every other frame matches mannequin_side.png
const ART_NAMES=["head", "chest", "pelvis", "upperArm", "forearm", "handR", "handL", "thigh", "calf", "shoe"];
const ART_BOX={"head": [335, 200, 130, 152], "chest": [358, 299, 94, 96], "pelvis": [355, 402, 89, 107], "upperArm": [360, 297, 52, 109], "forearm": [363, 361, 62, 98], "handR": [374, 413, 57, 69], "handL": [374, 422, 56, 59], "thigh": [353, 432, 85, 181], "calf": [340, 557, 80, 188], "shoe": [339, 693, 106, 107]};   // [x,y,w,h] crop of each frame (bbox + margin)
const ART_PIV={
  hip:[395.5,470], knee:[391,586], ankle:[372.5,702.8],            // hip = centre of the thigh's top cap / pelvis round; knee = where thigh bottom meets calf top; ankle = boot pivot (sole 96px below, heel 24px behind)
  shoulder:[386,323], elbow:[384,383], wrist:[395.5,433],          // shoulder = centre of the arm cap; elbow / wrist = joint ends of the arm parts
  rib:[389.7,380],                                                 // waist joint: on the hip->shoulder line, at the chest bottom
  neck:[385.2,311], headPivot:[396,300],                           // neck = 12px above the shoulder along the chest; head turns about the skull base
  neckFrom:[388,316], neckTo:[396,296],                            // neck line: inside the chest top / inside the hood
  stomachFrom:[402,424], stomachTo:[401,374],                      // stomach fill: just inside the pelvis top / just inside the chest bottom
  bagHip:[394,443],                                                // crossbody bag: where its two strap loops hang on the near hip (pelvis art)
  strapTop:[384,313]                                               // crossbody strap: the apex over the far shoulder (chest art)
};
/* Pivot edits made in the Pivots menu are remembered in this browser (localStorage). They are discarded automatically if the
   defaults change. The defaults come from json_files/rig_config.json ("pivots"); the block above holds the built-in defaults. */
const PIV_DEFAULT=JSON.parse(JSON.stringify(ART_PIV)), PIV_KEY='rigArtPivots_v1';
function pivRestore(){try{const o=JSON.parse(localStorage.getItem(PIV_KEY)||'null');   // only the keys that were saved must still match, so newly added pivots don't discard old edits
    if(o&&o.base&&Object.keys(o.base).every(k=>k in PIV_DEFAULT&&JSON.stringify(o.base[k])===JSON.stringify(PIV_DEFAULT[k]))) for(const k in PIV_DEFAULT) if(o.cur&&o.cur[k]) ART_PIV[k]=o.cur[k].slice();}catch(e){}}
pivRestore();
const dist2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const artBonesCalc=()=>({ thigh:dist2(ART_PIV.hip,ART_PIV.knee), shin:dist2(ART_PIV.knee,ART_PIV.ankle),
                  upperArm:dist2(ART_PIV.shoulder,ART_PIV.elbow), forearm:dist2(ART_PIV.elbow,ART_PIV.wrist),
                  chestToPelvis:dist2(ART_PIV.hip,ART_PIV.rib), neckToChest:dist2(ART_PIV.rib,ART_PIV.shoulder)+12 });
const ART_BONES=artBonesCalc();
let ART_NECK=dist2(ART_PIV.neck,ART_PIV.headPivot);
const PARTS={}; let partsReady=false, artLabel='loading...';

/* ---------- data (fetched from json_files/*.json, so serve over http, e.g. VS Code Live Server) ---------- */
let bones, gait, dataSrc = 'json_files/';
const getJSON=async u=>{ const r=await fetch(u); if(!r.ok) throw new Error(u+' ('+r.status+')'); return r.json(); };
function showLoadError(e){   // loud on purpose: nothing is embedded any more, so a bad path or file:// must be obvious
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:14px;top:12px;max-width:560px;padding:10px 14px;background:#170032;border:1px solid #ff6200;color:#ff9a9e;font-size:13px;z-index:20;box-shadow:0 0 14px rgba(255,98,0,.5)';
  d.textContent='RIG//LAB load error: '+e.message+'. Serve this folder over http (VS Code Live Server); file:// cannot fetch json_files/.';
  document.body.appendChild(d);
}
async function loadData(){
  const [b,g] = await Promise.all([getJSON('json_files/bone_lengths.json'), getJSON('json_files/gait_angles.json')]);
  if(!(b.bones && b.torso && g.cycles)) throw new Error('bone_lengths.json needs bones + torso, gait_angles.json needs cycles');
  bones=b; gait=g;
  try{   // slider defaults: optional, independent of the two files above; missing file = the constants in this file
    const r=await fetch('json_files/rig_config.json'); if(!r.ok) throw 0;
    if(cfgApply(await r.json(),true)) dataSrc+=' + rig_config.json';
  }catch(e){ /* keep built-in defaults */ }
}

/* ---------- parameters ---------- */
const BASE = { chestDepth:40, neckLen:26, headR:30, bgLight:true, bgGrid:true, gridSize:50, gridAlpha:.5, bootOn:true, art:true, skel:false, farTint:.22, neckTrim:12, waistTrim:24, nearLegOver:true, pelvisTilt:.85, headFollow:.4, neckW:26, soleOff:96.2, footLen:95, heelFrac:.259, footLag:0, lag:1.5, range:.5,
  spPassing:1, spTakeoff:.7, spUp:.1, spContact:.35, spDown:.4,
  guides:false, joints:true, floor:true, scroll:1, zoom:1, lineW:6, tint:true,
  stomach:true, stomachWChest:44, stomachWPelvis:50, stomachColor:'#210250',
  bag:true, bagOverArm:false, bagScale:.5, bagSwing:1, bagSurge:.1, bagLean:.6, bagHold:1.2, bagLen:1, bagZ:.25, charmZ:.12,
  strap:true, strapW:10, strapSlack:.08, strapColor:'#37025a', strapEdge:'#170032' };
/* Measured from the shoe frame of mannequin_side.png: sole 96.2px below the ankle pivot, heel back corner 23.5px behind it,
   toe-platform front corner 61.5px ahead (contact length 85, heel fraction .276). Bare mannequin foot: sole 39px below, 90px long, heel .22. */
const FOOT_PRESET={ boot:{soleOff:96.2,footLen:85,heelFrac:.276}, bare:{soleOff:39,footLen:90,heelFrac:.22} };
const CYCLE_DEFAULTS = {
  run: { spineAngle:45, chestAngle:47, cycleSec:2,  airtime:15, twist:14, hipTwist:10, headBob:2,   headJut:3, neckAngle:44, ssAmt:1 },
  walk:{ spineAngle:84, chestAngle:86, cycleSec:1.1, airtime:0,  twist:8,  hipTwist:6,  headBob:1.5, headJut:1, neckAngle:6,  ssAmt:1 }
};
// stride = floor px per cycle that keeps the stance foot roughly planted; phases line up twist / lift with the poses
const CYC = { run:{stride:1183,strideBoot:1628,twistPh:0,liftPh:0}, walk:{stride:611,strideBoot:640,twistPh:.25,liftPh:.125} };
const strideNow=()=>CYC[S.cycle][P.bootOn?'strideBoot':'stride'];
const P = {};
const S = { cycle:'run', speed:1, playing:true, T:0, edit:false };
const BAG = { rev:0, baked:-1, tab:null, N:0 };   // rev bumps whenever anything the swing depends on changes; the table is re-baked lazily when rev != baked
let ACC_IMG=null;

/* ---------- key-pose tables ---------- */
let order=[], keys={}, speeds=[], stKeys={}, ftKeys={};
const ptype = nm => nm.split('_')[1];

/* Squash/stretch grid: percent of bone length, per pose TYPE x body part.
   Parts are relative to the pose's name: "front leg" = the named side's leg, "back leg" = the other one,
   "fwd arm" = the arm swinging forward at that pose (opposite side of the named leg), "back arm" = the other.
   + = stretch, - = squash. */
const GRID_PARTS=[['fl','Front leg'],['bl','Back leg'],['fa','Fwd arm'],['ba','Back arm'],['t','Torso']];
const GRID_DEFAULT={
  run: { passing:{}, takeoff:{fl:3,bl:5,fa:4}, up:{}, contact:{fl:-5,t:-4} },
  walk:{ contact:{}, down:{}, passing:{}, up:{} }
};
let GRIDS=null;
function resetGrids(){GRIDS=JSON.parse(JSON.stringify(GRID_DEFAULT));}
const gv=(t,k)=>((GRIDS[S.cycle][t]||{})[k])||0;

/* Foot grid: degrees the toes point DOWN from flat. 0 = flat on the ground, ~45 = heel up / toes planted (push-off),
   90 = toes straight down, negative = toes up (heel strike). "Front foot" = the foot of the leg the pose is named for,
   "back foot" = the other one. The foot is a rigid wedge pivoting on the ankle. */
const FOOT_PARTS=[['f','Front foot'],['b','Back foot']];
const FOOT_DEFAULT={
  bare:{
    run: { passing:{f:80,b:0}, takeoff:{f:55,b:45}, up:{f:30,b:75}, contact:{f:-15,b:85} },
    walk:{ contact:{f:-15,b:50}, down:{f:0,b:60}, passing:{f:25,b:0}, up:{f:-5,b:40} }
  },
  /* Platform boots: rigid block with a flat sole, so no heel-strike. The front platform lands first (toes slightly down)
     and the swing foot hangs less because the ankle is already plantarflexed inside the boot. */
  boot:{
    run: { passing:{f:60,b:0}, takeoff:{f:40,b:35}, up:{f:25,b:55}, contact:{f:8,b:60} },
    walk:{ contact:{f:0,b:35}, down:{f:0,b:40}, passing:{f:20,b:0}, up:{f:0,b:30} }
  }
};
let FGRIDS=null;
const footMode=()=>P.bootOn?'boot':'bare';
function resetFootGrids(){FGRIDS=JSON.parse(JSON.stringify(FOOT_DEFAULT));}
const fv=(t,k)=>((FGRIDS[footMode()][S.cycle][t]||{})[k])||0;

/* ======================= RIG CONFIG (json_files/rig_config.json) =======================
   Every default the menus start from lives in that file, so a new character is a new JSON, not new rig code:
   shared sliders (by menu group), per-cycle sliders + stride, squash/stretch grid, foot-angle grid, foot presets, art pivots.
   The constants above (BASE, CYCLE_DEFAULTS, CYC, GRID_DEFAULT, FOOT_DEFAULT, FOOT_PRESET, ART_PIV) are the built-in defaults
   used when the file is missing. "Export config" writes the live slider values in this format;
   "Import config" loads one without needing a server. Missing or invalid keys are skipped, so partial configs are fine. */
const CFG_GROUPS={
  body:['chestDepth','neckLen','headR','neckW','neckTrim','waistTrim','pelvisTilt','headFollow','stomach','stomachWChest','stomachWPelvis','stomachColor'],
  motion:['range','lag','footLag'],
  poseSpeed:['spPassing','spTakeoff','spUp','spContact','spDown'],
  feet:['bootOn','soleOff','footLen','heelFrac'],
  art:['art','skel','farTint','nearLegOver'],
  view:['bgLight','bgGrid','gridSize','gridAlpha','guides','joints','floor','scroll','zoom','lineW','tint'],
  bag:['bag','bagOverArm','bagScale','bagSwing','bagSurge','bagLean','bagHold','bagLen','bagZ','charmZ','strap','strapW','strapSlack','strapColor','strapEdge']
};
const CFG_CYCLE_KEYS=['spineAngle','chestAngle','neckAngle','cycleSec','airtime','twist','hipTwist','headBob','headJut','ssAmt'];
let CFG_META={name:'mannequin',description:'Rig Lab slider defaults for one character.'};
const CYC_LIVE={};   // per-cycle slider values edited this session, so switching Run/Walk no longer discards them
const cfgClone=o=>JSON.parse(JSON.stringify(o));
const cfgOk=(v,ref)=>typeof v===typeof ref&&(typeof v!=='number'||Number.isFinite(v));
const cfgRound=v=>typeof v==='number'?Math.round(v*10000)/10000:v;
function cfgStash(){ if(P.cycleSec===undefined||!S.cycle) return; const o={}; CFG_CYCLE_KEYS.forEach(k=>o[k]=P[k]); CYC_LIVE[S.cycle]=o; }

function cfgApply(c,startup){
  if(!c||typeof c!=='object'||Array.isArray(c)) return false;
  const warn=[], put=(dst,k,v,where)=>{ if(k in dst&&cfgOk(v,dst[k])) dst[k]=v; else warn.push(where+'.'+k); };
  if(c.meta&&typeof c.meta==='object') CFG_META=cfgClone(c.meta);
  for(const g in (c.shared||{})) for(const k in c.shared[g]) put(BASE,k,c.shared[g][k],'shared.'+g);
  for(const cy in (c.cycles||{})){
    const o=c.cycles[cy]; if(!CYCLE_DEFAULTS[cy]||!o) continue;
    for(const k in (o.params||{})) put(CYCLE_DEFAULTS[cy],k,o.params[k],'cycles.'+cy+'.params');
    const st={stride:'stride',strideBoot:'strideBoot',twistPhase:'twistPh',liftPhase:'liftPh'};
    for(const k in st) if(k in o) put(CYC[cy],st[k],o[k],'cycles.'+cy);
  }
  for(const m in (c.footPresets||{})) if(FOOT_PRESET[m]) for(const k in c.footPresets[m]) put(FOOT_PRESET[m],k,c.footPresets[m][k],'footPresets.'+m);
  const grid=(src,dst,where)=>{ for(const cy in (src||{})) if(dst[cy]&&src[cy]&&typeof src[cy]==='object') dst[cy]=cfgClone(src[cy]); else if(src&&src[cy]) warn.push(where+'.'+cy); };
  grid(c.squashStretch,GRID_DEFAULT,'squashStretch');
  for(const m in (c.footAngles||{})) if(FOOT_DEFAULT[m]) grid(c.footAngles[m],FOOT_DEFAULT[m],'footAngles.'+m);
  if(c.pivots&&typeof c.pivots==='object'){
    for(const k in PIV_DEFAULT){ const p=c.pivots[k]; if(Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)) ART_PIV[k]=p.slice(); else if(k in c.pivots) warn.push('pivots.'+k); }
    for(const k in PIV_DEFAULT) PIV_DEFAULT[k]=ART_PIV[k].slice();
    if(startup) pivRestore(); else { try{localStorage.removeItem(PIV_KEY);}catch(e){} }
    Object.assign(ART_BONES,artBonesCalc()); ART_NECK=dist2(ART_PIV.neck,ART_PIV.headPivot);
  }
  if(warn.length) console.warn('rig_config: skipped invalid or unknown keys:',warn.join(', '));
  return true;
}
function cfgRefreshUI(){   // after an import: restart the menus from the (new) defaults
  for(const k in CYC_LIVE) delete CYC_LIVE[k];
  Object.assign(P,BASE,CYCLE_DEFAULTS[S.cycle]);rebuildTints();resetGrids();resetFootGrids();
  recomputeArt();renderGrids();syncAll();pivSyncUI();
}
function cfgBuild(){
  cfgStash();
  const out={meta:Object.assign({},CFG_META,{exported:new Date().toISOString()}),shared:{},cycles:{}};
  for(const g in CFG_GROUPS){out.shared[g]={};CFG_GROUPS[g].forEach(k=>out.shared[g][k]=cfgRound(P[k]));}
  for(const cy in CYCLE_DEFAULTS){
    const src=CYC_LIVE[cy]||CYCLE_DEFAULTS[cy], params={};
    CFG_CYCLE_KEYS.forEach(k=>params[k]=cfgRound(src[k]));
    out.cycles[cy]={params,stride:CYC[cy].stride,strideBoot:CYC[cy].strideBoot,twistPhase:CYC[cy].twistPh,liftPhase:CYC[cy].liftPh};
  }
  out.footPresets=cfgClone(FOOT_PRESET);
  const full=(g,parts)=>{const o={};for(const t in g){o[t]={};parts.forEach(([k])=>o[t][k]=cfgRound(parseFloat(g[t][k])||0));}return o;};   // every cell written, so the file is a complete template
  out.squashStretch={};for(const cy in GRIDS) out.squashStretch[cy]=full(GRIDS[cy],GRID_PARTS);
  out.footAngles={};for(const m in FGRIDS){out.footAngles[m]={};for(const cy in FGRIDS[m]) out.footAngles[m][cy]=full(FGRIDS[m][cy],FOOT_PARTS);}
  out.pivots={};PIV_INFO.forEach(([k])=>out.pivots[k]=[pivF(ART_PIV[k][0]),pivF(ART_PIV[k][1])]);
  return out;
}
function cfgStringify(v,ind=''){   // pretty JSON, but short leaf objects stay on one line so the file reads like a table
  if(v===null||typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(x=>cfgStringify(x)).join(', ')+']';
  const ks=Object.keys(v); if(!ks.length) return '{}';
  const flat=ks.every(k=>v[k]===null||typeof v[k]!=='object'||(Array.isArray(v[k])&&v[k].every(x=>typeof x!=='object')));
  if(flat){const one='{ '+ks.map(k=>JSON.stringify(k)+': '+cfgStringify(v[k])).join(', ')+' }'; if(one.length+ind.length<=110) return one;}
  return '{\n'+ks.map(k=>ind+'  '+JSON.stringify(k)+': '+cfgStringify(v[k],ind+'  ')).join(',\n')+'\n'+ind+'}';
}
function cfgDownload(btn){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([cfgStringify(cfgBuild())+'\n'],{type:'application/json'}));
  a.download='rig_config.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  if(btn){btn.textContent='Exported ✓';setTimeout(()=>btn.textContent='⬇ Export config',1400);}
}
function cfgImport(file,btn){
  file.text().then(t=>{
    if(!cfgApply(JSON.parse(t),false)) throw 0;
    dataSrc=dataSrc.replace(/ \+ (rig_config\.json|imported config)/g,'')+' + imported config'; cfgRefreshUI();
    if(btn){btn.textContent='Imported ✓';setTimeout(()=>btn.textContent='⬆ Import',1400);}
  }).catch(()=>{if(btn){btn.textContent='Not a rig config';setTimeout(()=>btn.textContent='⬆ Import',1800);}});
}

function stretchFor(nm){
  const side=nm.startsWith('left')?'L':'R', opp=side==='L'?'R':'L', t=ptype(nm), g=k=>gv(t,k)/100;
  const z={lL:0,lR:0,aL:0,aR:0,t:g('t')};
  z['l'+side]=g('fl'); z['l'+opp]=g('bl');
  z['a'+opp]=g('fa');  z['a'+side]=g('ba');
  return z;
}
function rebuild(){
  BAG.rev++;
  const c=gait.cycles[S.cycle]; order=c.poseOrder;
  const pick=r=>r[0]+(r[1]-r[0])*P.range;
  keys={lT:[],lS:[],rT:[],rS:[],lU:[],lF:[],rU:[],rF:[]};
  stKeys={lL:[],lR:[],aL:[],aR:[],t:[]};
  ftKeys={l:[],r:[]};
  const spd={passing:P.spPassing,takeoff:P.spTakeoff,up:P.spUp,contact:P.spContact,down:P.spDown};
  speeds=[];
  order.forEach(nm=>{
    const p=c.poses[nm];
    keys.lT.push(pick(p.legs.left.thigh));  keys.lS.push(pick(p.legs.left.shin));
    keys.rT.push(pick(p.legs.right.thigh)); keys.rS.push(pick(p.legs.right.shin));
    keys.lU.push(pick(p.arms.left.upperArm));  keys.lF.push(pick(p.arms.left.forearm));
    keys.rU.push(pick(p.arms.right.upperArm)); keys.rF.push(pick(p.arms.right.forearm));
    const z=stretchFor(nm); for(const k in z) stKeys[k].push(z[k]);
    const sd=nm.startsWith('left')?'l':'r', ty=ptype(nm);
    ftKeys.l.push(fv(ty,sd==='l'?'f':'b')); ftKeys.r.push(fv(ty,sd==='r'?'f':'b'));
    speeds.push(spd[ptype(nm)] ?? .5);
  });
}

/* ---------- sampling ---------- */
function hermite(v0,v1,m0,m1,f){const f2=f*f,f3=f2*f;
  return (2*f3-3*f2+1)*v0+(f3-2*f2+f)*m0+(-2*f3+3*f2)*v1+(f3-f2)*m1;}
// Catmull-Rom tangents scaled per key by "pose speed": 1 = whips through, 0 = hangs on the pose
function sampleH(vals,u){
  const n=vals.length, p=(((u%1)+1)%1)*n, i=Math.floor(p), f=p-i;
  const a=i%n,b=(i+1)%n,c=(i+n-1)%n,d=(i+2)%n;
  return hermite(vals[a],vals[b],speeds[a]*(vals[b]-vals[c])/2,speeds[b]*(vals[d]-vals[a])/2,f);
}
function sampleS(vals,u){
  const n=vals.length, p=(((u%1)+1)%1)*n, i=Math.floor(p), f=p-i, s=f*f*(3-2*f);
  return vals[i%n]+(vals[(i+1)%n]-vals[i%n])*s;
}

/* ---------- feet ---------- */
const dirF = deg => [Math.sin(deg*R2D), Math.cos(deg*R2D)];
// foot angle (from vertical-down, +forward; 90 = flat) = 90 - "toes down" degrees, following the shin with extra lag
function footAngleAt(k,u){const lagU=P.footLag/(FPS*P.cycleSec/S.speed);return 90-sampleS(ftKeys[k],u-lagU);}
// the foot is a rigid block: ankle (pivot) -> heel / toe contact corners, with the sole P.soleOff px below the ankle line
function footGeom(ankle,fa){
  const d=dirF(fa), n=[-d[1],d[0]], L=P.footLen, hf=P.heelFrac, base=[ankle[0]+n[0]*P.soleOff,ankle[1]+n[1]*P.soleOff];
  return {heel:[base[0]-d[0]*L*hf,base[1]-d[1]*L*hf], toe:[base[0]+d[0]*L*(1-hf),base[1]+d[1]*L*(1-hf)]};
}
function footDrop(fa){   // how far below the ankle the lowest sole point sits
  const d=dirF(fa), L=P.footLen, hf=P.heelFrac;
  return Math.max(2,P.soleOff*d[0]+Math.max(0,d[1]*L*(1-hf),-d[1]*L*hf));
}

/* ---------- foot height helpers (for the pelvis curve) ---------- */
function legsLow(u){   // how far below the pelvis the lowest foot point is, at phase u
  const L=bones.bones, lagU=P.lag/(FPS*P.cycleSec/S.speed);
  let low=-1e9;
  for(const k of ['l','r']){
    const sc=1+P.ssAmt*sampleS(stKeys[k==='l'?'lL':'lR'],u);
    const tA=sampleH(keys[k+'T'],u), sA=sampleH(keys[k+'S'],u-lagU);
    const ay=L.thigh.length*sc*Math.cos(tA*R2D)+L.shin.length*sc*Math.cos(sA*R2D);
    const fa=footAngleAt(k,u);
    low=Math.max(low,ay+footDrop(fa));
  }
  return low;
}
function stanceH(){    // base pelvis height = average foot-drop across the grounded key poses
  const n=order.length; let sum=0,cnt=0;
  order.forEach((nm,i)=>{const t=ptype(nm);if(t==='passing'||t==='contact'||t==='down'){sum+=legsLow(i/n);cnt++;}});
  return cnt?sum/cnt:300;
}

/* ---------- the rig solve ---------- */
const dirV = deg => [Math.sin(deg*R2D), Math.cos(deg*R2D)];   // from vertical-down, +forward
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];

function solve(u){
  const L=bones.bones, Tm=bones.torso, cy=CYC[S.cycle];
  const lagU = P.lag/(FPS*P.cycleSec/S.speed);
  const tw = Math.sin(2*Math.PI*(u+cy.twistPh));                 // +1: right shoulder fwd / left hip fwd
  const lc = .5-.5*Math.cos(4*Math.PI*(u-cy.liftPh));            // 0..1, peaks at the "up" poses
  const a=P.ssAmt;
  const sc={lL:1+a*sampleS(stKeys.lL,u), lR:1+a*sampleS(stKeys.lR,u),
            aL:1+a*sampleS(stKeys.aL,u), aR:1+a*sampleS(stKeys.aR,u), t:1+a*sampleS(stKeys.t,u)};
  const guides=[];
  const limb=(root,aA,lA,aB,lB)=>{
    const mid=add(root,dirV(aA),lA), end=add(mid,dirV(aB),lB);
    guides.push({c:root,r:lA},{c:mid,r:lB});
    return [mid,end];
  };
  /* legs — hips sit at the pelvis, nudged by hip twist */
  const pelvis=[0,0];
  const hipL=[ P.hipTwist*tw,0], hipR=[-P.hipTwist*tw,0];
  const legs={};
  const isRun=S.cycle==='run';
  const hRun=isRun?stanceH()+P.airtime*Math.pow(lc,2.5):0;   // designed pelvis bounce: peaks at "up"
  for(const [s,hip,sk] of [['L',hipL,'l'],['R',hipR,'r']]){
    const k=sk, tA=sampleH(keys[k+'T'],u), sA=sampleH(keys[k+'S'],u-lagU);
    const fa=footAngleAt(k,u);
    let legSc=sc['l'+s];
    if(isRun){
      /* foot plant: a leg that is near the ground stretches/compresses (max ±12%) so its foot meets the floor
         at the bounce height; legs in the air are left alone */
      const ay=L.thigh.length*Math.cos(tA*R2D)+L.shin.length*Math.cos(sA*R2D);
      const ft=footDrop(fa);
      const f=Math.max(.88,Math.min(1.12,(hRun-ft)/(ay*legSc)));
      const t=Math.max(0,Math.min(1,(ay*legSc+ft-(hRun-70))/50));
      legSc*=1+(f-1)*t*t*(3-2*t);
    }
    const [knee,ankle]=limb(hip,tA,L.thigh.length*legSc,sA,L.shin.length*legSc);
    {const fg=footGeom(ankle,fa);legs[s]={hip,knee,ankle,heel:fg.heel,toe:fg.toe,drop:footDrop(fa),fa};}
  }
  /* torso */
  const sp=[Math.cos(P.spineAngle*R2D),-Math.sin(P.spineAngle*R2D)];
  const ch=[Math.cos(P.chestAngle*R2D),-Math.sin(P.chestAngle*R2D)];
  const nrm=[Math.sin(P.chestAngle*R2D),Math.cos(P.chestAngle*R2D)];   // chest-front normal
  const rib=add(pelvis,sp,Math.max(0,Tm.chestToPelvis-P.waistTrim)*sc.t);   // waistTrim pulls the whole upper body down toward the pelvis (the art leaves a gap there)
  const shTop=add(rib,ch,Tm.neckToChest*sc.t);
  const rect=[add(rib,nrm,-P.chestDepth/2),add(rib,nrm,P.chestDepth/2),
              add(shTop,nrm,P.chestDepth/2),add(shTop,nrm,-P.chestDepth/2)];
  const shC=add(shTop,ch,-12);
  const shNear=add(shC,nrm,tw*P.twist), shFar=add(shC,nrm,-tw*P.twist);
  /* arms: right = near, left = far */
  const arms={};
  for(const [s,root,sk] of [['L',shFar,'l'],['R',shNear,'r']]){
    const [elbow,wrist]=limb(root,sampleH(keys[sk+'U'],u),L.upperArm.length*sc['a'+s],
                                  sampleH(keys[sk+'F'],u-lagU),L.forearm.length*sc['a'+s]);
    arms[s]={root,elbow,wrist};
  }
  /* neck + head */
  const nd=[Math.sin(P.neckAngle*R2D),-Math.cos(P.neckAngle*R2D)];
  const off=[P.headJut*lc,-P.headBob*lc];
  const head=add(add(add(shTop,nd,P.neckLen+P.headR),off),[0,0]);
  const neckEnd=add(head,nd,-P.headR);
  /* pelvis height. Run: the designed bounce above (no sinking at "up"). Walk: lowest foot locked to y=0. */
  const low=Math.max(legs.L.ankle[1]+legs.L.drop,legs.R.ankle[1]+legs.R.drop);
  const h=isRun?hRun:low;
  const oy=-h;
  return {pelvis,legs,rib,shTop,rect,shNear,shFar,arms,head,neckEnd,guides,oy,lc,ss:sc};
}

/* ---------- crossbody bag + charms ---------- */
/* assets/images/accessories.png = four 350x350 frames in ONE shared layout (stacked, they are bag.png): 0 bag, 1 crystal, 2 rune tag, 3 O-ring.
   Points are pixels inside a frame. pv = where a piece hangs (it rotates about it), com = its centre of mass, box = [x,y,w,h] crop.
   The bag hangs from its strap tabs at the near hip (ART_PIV.bagHip); the O-ring hangs on the bag's big ring, the crystal on the O-ring,
   the tag on the bag's side ring. Each piece is a damped rigid pendulum driven by how its pivot accelerates (hip bounce + a footfall surge).
   The swing is baked over a few warm-up cycles into a table per run phase, so it loops seamlessly, scrubs backwards and follows speed changes. */
const ACC_URL='assets/images/accessories.png', ACC_FR=350, GRAV=4400;   // GRAV px/s^2: about 9.8 m/s^2 for a character ~780 px tall
const ACC={
  bag:    {f:0,box:[88,13,196,191], pv:[185,62], com:[186,115]},
  ring:   {f:3,box:[144,153,38,46], pv:[163,162],com:[164,176]},
  crystal:{f:1,box:[135,180,56,162],pv:[164,189],com:[163,262]},
  tag:    {f:2,box:[245,118,40,172],pv:[272,126],com:[265,204]}
};
const ACC_HOOK={ring:[163,162], crystal:[164,189], tag:[272,126], tabF:[270,57], tabB:[101,66]};   // where each child hangs on its parent (= the child's pv at rest); the two strap tabs on the bag
const ACC_PARENT={ring:'bag', crystal:'ring', tag:'bag'}, ACC_DRAW=['bag','tag','ring','crystal'], ACC_DAMP={bag:1,ring:1.5,crystal:1,tag:1.3};
for(const k in ACC){const a=ACC[k]; a.d=Math.hypot(a.com[0]-a.pv[0],a.com[1]-a.pv[1]); a.k2=(a.box[2]*a.box[2]+a.box[3]*a.box[3])/12;
  a.leff=(a.k2+a.d*a.d)/a.d; a.u=[(a.com[0]-a.pv[0])/a.d,(a.com[1]-a.pv[1])/a.d];}   // equivalent pendulum length of a rigid plate hung off-centre
const rotv=(v,th)=>{const c=Math.cos(th),n=Math.sin(th);return [v[0]*c-v[1]*n,v[0]*n+v[1]*c];};
function loadAcc(){
  return new Promise(res=>{const im=new Image();
    im.onload=()=>{if(im.naturalWidth===ACC_FR*4&&im.naturalHeight===ACC_FR) ACC_IMG=im; else console.warn(ACC_URL+' must be 1400x350 (four 350x350 frames), got '+im.naturalWidth+'x'+im.naturalHeight); res();};
    im.onerror=()=>{console.warn('could not load '+ACC_URL);res();}; im.src=ACC_URL;});
}
function bagBake(){
  BAG.baked=BAG.rev; BAG.tab=null;
  if(!partsReady||!bones||!order.length) return;
  const V=ART_PIV, cy=S.cycle, fc=S.speed/P.cycleSec, Tc=1/fc, s=P.bagScale, M=240, h=Tc/M, pr=P.pelvisTilt*(90-P.spineAngle)*R2D, pos=[];
  for(let i=0;i<M;i++){const r=solve(i/M), a=mapPt(V.hip,r.pelvis,pr,V.bagHip); pos.push([a[0],a[1]+r.oy]);}   // world path of the hang point over one cycle
  let acc=pos.map((p,i)=>{const a=pos[(i+1)%M],b=pos[(i+M-1)%M];return [(a[0]-2*p[0]+b[0])/(h*h),(a[1]-2*p[1]+b[1])/(h*h)];});
  for(let k=0;k<3;k++) acc=acc.map((p,i)=>{const a=acc[(i+1)%M],b=acc[(i+M-1)%M];return [(a[0]+2*p[0]+b[0])/4,(a[1]+2*p[1]+b[1])/4];});   // the pose splines have kinks; smooth the accelerations
  /* the rig runs at constant speed, so a real body's braking and push-off is added as a forward/back surge twice per cycle, lowest at the pelvis' lowest point */
  const sg=P.bagSurge*(cy==='run'?1:.35)*strideNow()*4*Math.PI*fc*fc, lp=CYC[cy].liftPh;
  const N=Math.max(96,Math.min(1024,Math.ceil(Tc*240))), dt=Tc/N, ws=Math.max(4,Math.ceil(6/Tc))*N, names=['bag','ring','crystal','tag'], st={}, tab={};
  const restB=P.bagLean*pr;   // the bag leans along with the pelvis by this fraction, held there by the strap against the hip
  names.forEach(n=>{st[n]={th:n==='bag'?restB:0,w:0,al:0,Lw:ACC[n].leff*s*P.bagLen}; tab[n]=new Float32Array(N);});
  for(let step=0;step<ws+N;step++){
    const k=step%N, u=k/N, ai=u*M, i0=Math.floor(ai), f=ai-i0, A=acc[i0%M], B=acc[(i0+1)%M], ap={};
    ap.bag=[(A[0]*(1-f)+B[0]*f+sg*Math.sin(4*Math.PI*(u-lp)))*P.bagSwing,(A[1]*(1-f)+B[1]*f)*P.bagSwing];
    for(const n of names){
      const o=st[n], a=ACC[n], par=ACC_PARENT[n];
      if(par){   // acceleration of this pivot = parent's pivot acceleration + the parent swinging about its own pivot
        const p=st[par], w=[(ACC_HOOK[n][0]-ACC[par].pv[0])*s,(ACC_HOOK[n][1]-ACC[par].pv[1])*s], Rw=rotv(w,p.th), Rj=rotv([-w[1],w[0]],p.th), q=ap[par];
        ap[n]=[q[0]+p.al*Rj[0]-p.w*p.w*Rw[0], q[1]+p.al*Rj[1]-p.w*p.w*Rw[1]];
      }
      const d=rotv(a.u,o.th), q=ap[n], ks=n==='bag'?P.bagHold*GRAV/o.Lw:0, om=Math.sqrt(GRAV/o.Lw+ks), z=n==='bag'?P.bagZ:P.charmZ*ACC_DAMP[n];
      o.al=((GRAV-q[1])*d[0]+q[0]*d[1])/o.Lw-ks*(o.th-restB)-2*z*om*o.w;   // gravity + pivot acceleration (about the pivot), hold spring (bag only), damping
    }
    for(const n of names){const o=st[n]; o.w+=o.al*dt; o.th+=o.w*dt; if(Math.abs(o.th)>2.4){o.th=Math.sign(o.th)*2.4;o.w=0;} if(step>=ws) tab[n][k]=o.th;}
  }
  BAG.N=N; BAG.tab=tab;
}
function bagLayout(r){   // world placement of every piece for this frame: T = where its pv sits, th = rotation (rad, clockwise)
  const V=ART_PIV, s=P.bagScale, T=BAG.tab, N=BAG.N, pr=P.pelvisTilt*(90-P.spineAngle)*R2D, p=(((r.u%1)+1)%1)*N, i=Math.floor(p), f=p-i;
  const ang=n=>T[n][i%N]*(1-f)+T[n][(i+1)%N]*f, L={bag:{T:mapPt(V.hip,r.pelvis,pr,V.bagHip),th:ang('bag')},ring:{th:ang('ring')},crystal:{th:ang('crystal')},tag:{th:ang('tag')}};
  const pt=(n,q)=>{const a=ACC[n],o=L[n],v=rotv([(q[0]-a.pv[0])*s,(q[1]-a.pv[1])*s],o.th);return [o.T[0]+v[0],o.T[1]+v[1]];};
  L.ring.T=pt('bag',ACC_HOOK.ring); L.tag.T=pt('bag',ACC_HOOK.tag); L.crystal.T=pt('ring',ACC_HOOK.crystal);
  L.tabF=pt('bag',ACC_HOOK.tabF); L.tabB=pt('bag',ACC_HOOK.tabB); L.apex=chestPt(r,V.strapTop);
  return L;
}
function bagEnsure(r){   // null = nothing to draw (off, art missing, or the bake failed; a failed bake must never stop the render loop)
  if(!(P.bag&&ACC_IMG&&partsReady&&r.u!==undefined)) return null;
  try{ if(BAG.baked!==BAG.rev||!BAG.tab) bagBake(); return BAG.tab?bagLayout(r):null; }
  catch(e){ if(!BAG.err){BAG.err=1;console.error('bag:',e);} return null; }
}

  drawLeg(r.legs.L,tint(COL.far,r.ss.lL),true);
  /* pelvis + spine + far shoulder + chest rect */
  seg(r.pelvis,r.rib,tcT,P.lineW);
  ctx.beginPath();r.rect.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  ctx.fillStyle='rgba(165,90,255,.16)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=tcT;
  ctx.shadowColor=tcT;ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;
  if(P.joints){dot(r.rib,6,COL.torso);dot(r.shFar,11,COL.far);}
  /* neck + head */
  seg(r.shTop,r.neckEnd,COL.head,P.lineW*.8);
  ctx.beginPath();ctx.arc(r.head[0],r.head[1],P.headR,0,Math.PI*2);
  ctx.fillStyle='rgba(255,105,180,.12)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=COL.head;
  ctx.shadowColor=COL.head;ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(r.head[0]+P.headR*.45,r.head[1]-P.headR*.12,3,0,7);ctx.fillStyle='#FFC7FF';ctx.fill();
  /* near side */
  drawLeg(r.legs.R,tint(COL.near,r.ss.lR));
  if(P.joints) dot(r.shNear,11,COL.near);
  drawArm(r.arms.R,tint(COL.near,r.ss.aR));
  if(P.joints){dot(r.pelvis,10,COL.pelvis);dot(r.legs.L.hip,4,COL.joint);dot(r.legs.R.hip,4,COL.joint);}
  };
  const artOn=P.art&&partsReady;
  if(artOn) drawCharacter(r);
  if(!artOn) stick(); else if(P.skel){ctx.globalAlpha=.6;stick();ctx.globalAlpha=1;}
  ctx.restore();

  /* HUD + scrubber */
  const n=order.length,k=Math.round(u*n)%n,onKey=Math.abs(u*n-Math.round(u*n))<.06;
  const txt=`${S.cycle.toUpperCase()} // ${order[k]}${onKey?'':' ~'}`;
  if(txt!==lastHud){hud.firstChild.nodeValue=txt;lastHud=txt;}
  const tp=ptype(order[k]);
  if(tp!==lastType){for(const n in gridUI)for(const t in gridUI[n].rows)gridUI[n].rows[t].classList.toggle('now',t===tp);lastType=tp;}
  hud.lastChild.textContent=`phase ${u.toFixed(3)}  •  ${(P.cycleSec/S.speed).toFixed(2)}s cycle  •  data: ${dataSrc}  •  art: ${artLabel}  •  bag: ${ACC_IMG?(P.bag?'on':'off'):'accessories.png missing'}`;
  if(!scrubbing) scrub.value=Math.round(u*1000);
}

/* ---------- frame export: transparent PNG sequence + anchors.json, bundled in one .zip, for painting over in Krita etc. ----------
   Every frame is drawn by drawCharacter() exactly as on screen (bag, strap, boots, sliders), on ONE fixed canvas sized to fit the union of all frames.
   The pelvis x and the floor line land on the same pixel in every frame (origin in anchors.json), so the frames stack cleanly as layers. */
const EXP={scale:2,frames:0,pad:24,busy:false};   // frames 0 = auto: one per 1/24 s of the cycle at the current speed
const PROBE={w:1800,h:1500,ox:900,gy:1200};   // scratch canvas at 1x (rig px) used to measure the union bounds of all frames
const expAuto=()=>{const m=order.length||1;return Math.max(1,Math.round(P.cycleSec/S.speed*FPS/m))*m;};   // about 24 fps, rounded to a multiple of the key-pose count so every key pose lands exactly on a frame
const tick=()=>new Promise(r=>setTimeout(r,0));
const solveAt=(i,n)=>{const u=i/n,r=solve(u);r.u=u;return r;};
function expDraw(c2,r,sc,ox,gy){   // one solved frame onto c2: pelvis x -> ox, floor line -> gy. drawCharacter draws through the global ctx, so it is swapped for the call
  const keep=ctx; ctx=c2;
  try{c2.setTransform(1,0,0,1,0,0);c2.clearRect(0,0,c2.canvas.width,c2.canvas.height);c2.setTransform(sc,0,0,sc,ox,gy);c2.translate(0,r.oy);c2.imageSmoothingEnabled=true;c2.imageSmoothingQuality='high';drawCharacter(r);}
  finally{ctx=keep;}
}
function expBounds(n){   // union of every frame's drawn pixels, in rig px relative to (pelvis x, floor y)
  const c=document.createElement('canvas');c.width=PROBE.w;c.height=PROBE.h;const x=c.getContext('2d',{willReadFrequently:true});
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<n;i++){
    expDraw(x,solveAt(i,n),1,PROBE.ox,PROBE.gy);
    const d=x.getImageData(0,0,PROBE.w,PROBE.h).data;
    for(let y=0;y<PROBE.h;y++){const o=y*PROBE.w*4+3;for(let px=0;px<PROBE.w;px++)if(d[o+px*4]){if(px<x0)x0=px;if(px>x1)x1=px;if(y<y0)y0=y;if(y>y1)y1=y;}}
  }
  if(x1<0) throw new Error('nothing was drawn (is the art on?)');
  if(x0<=0||y0<=0||x1>=PROBE.w-1||y1>=PROBE.h-1) throw new Error('the character is larger than the measuring canvas');
  return {l:x0-PROBE.ox,t:y0-PROBE.gy,r:x1+1-PROBE.ox,b:y1+1-PROBE.gy};
}
function rigAnchors(r){   // key points of one solved frame in rig px (before the floor shift r.oy); mirrors the transforms drawCharacter uses for the neck and head
  const V=ART_PIV, nd=[Math.sin(P.neckAngle*R2D),-Math.cos(P.neckAngle*R2D)], hp=add(add(r.shTop,nd,ART_NECK-P.neckTrim),[P.headJut*r.lc,-P.headBob*r.lc]);
  const shC=add(r.shTop,[Math.cos(P.chestAngle*R2D),-Math.sin(P.chestAngle*R2D)],-12), neck=mapPt(V.rib,r.rib,limbRot(V.rib,V.shoulder,r.rib,shC),V.neckFrom);
  const ft=l=>({ankle:l.ankle,heel:l.heel,toe:l.toe,lift:-(Math.max(l.heel[1],l.toe[1])+r.oy)});   // lift = lowest sole point above the floor
  return {pelvis:r.pelvis,neck,head:hp,shoulderNear:r.shNear,shoulderFar:r.shFar,handNear:r.arms.R.wrist,handFar:r.arms.L.wrist,footNear:ft(r.legs.R),footFar:ft(r.legs.L)};
}
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0;};
function zipStore(files){   // [{name,data:Uint8Array}] -> Blob; stored, not deflated (PNGs are already compressed)
  const enc=new TextEncoder(), parts=[], cen=[], now=new Date(); let off=0, cs=0;
  const dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(), tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    parts.push(lh.buffer,nm,f.data); cen.push(ch.buffer,nm); off+=30+nm.length+sz; cs+=46+nm.length;
  }
  const end=new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}
async function exportFrames(){
  if(EXP.busy) return;
  const st=$('expStatus'), btn=$('expGo'), say=(t,bad)=>{st.textContent=t;st.classList.toggle('err',!!bad);};
  if(!partsReady){say('The character art has not loaded yet.',1);return;}
  EXP.busy=true;btn.disabled=true;document.body.classList.add('exporting');
  try{
    const cyc=S.cycle, n=EXP.frames||expAuto(), sc=EXP.scale, pad=EXP.pad, sec=P.cycleSec/S.speed, m=order.length;
    say('Measuring all '+n+' frames…');await tick();
    const b=expBounds(n), ox=Math.ceil((-b.l+pad)*sc), gy=Math.ceil((-b.t+pad)*sc), w0=Math.ceil(ox+(b.r+pad)*sc), h0=Math.ceil(gy+(b.b+pad)*sc), FW=w0+(w0&1), FH=h0+(h0&1);   // even sizes
    if(FW>8192||FH>8192) throw new Error('each frame would be '+FW+'×'+FH+' px; lower the scale or padding');
    const c=document.createElement('canvas');c.width=FW;c.height=FH;const x=c.getContext('2d'), tag=cyc+'_'+n+'f_'+sc+'x', files=[], frames=[];
    const px=(p,r)=>[+(ox+p[0]*sc).toFixed(1),+(gy+(p[1]+r.oy)*sc).toFixed(1)];
    for(let i=0;i<n;i++){
      say('Rendering frame '+(i+1)+' / '+n+'  ('+FW+'×'+FH+' px)…');await tick();
      const r=solveAt(i,n), a=rigAnchors(r), name=cyc+'_'+String(i).padStart(3,'0')+'.png';
      expDraw(x,r,sc,ox,gy);
      const blob=await new Promise(res=>c.toBlob(res,'image/png'));   // toBlob copies the bitmap at call time, so reusing the canvas for the next frame is safe
      files.push({name:tag+'/'+name,data:new Uint8Array(await blob.arrayBuffer())});
      const foot=l=>({ankle:px(l.ankle,r),heel:px(l.heel,r),toe:px(l.toe,r),lift:+(l.lift*sc).toFixed(1),contact:l.lift<3});
      const k=Math.round(r.u*m)%m, onKey=Math.abs(r.u*m-Math.round(r.u*m))<.06;
      frames.push({i,file:name,phase:+r.u.toFixed(4),keyPose:onKey?order[k]:null,pelvisHeight:+(-r.oy*sc).toFixed(1),
        points:{pelvis:px(a.pelvis,r),neck:px(a.neck,r),head:px(a.head,r),shoulderNear:px(a.shoulderNear,r),shoulderFar:px(a.shoulderFar,r),handNear:px(a.handNear,r),handFar:px(a.handFar,r)},
        footNear:foot(a.footNear),footFar:foot(a.footFar)});
    }
    const meta={tool:'Rig Lab',cycle:cyc,exported:new Date().toISOString(),frameCount:n,loop:true,cycleSeconds:+sec.toFixed(4),playbackFps:+(n/sec).toFixed(3),scale:sc,paddingRigPx:pad,frameSize:[FW,FH],
      origin:{x:ox,y:gy,note:'the pixel in every frame that is the pelvis x and the floor line; put this point on the character position in the game'},
      coordinates:'pixels in the exported frame: origin top-left, y down. Frame i is phase i/frameCount of the loop. neck = where a cape or hood attaches. lift = lowest sole point above the floor (px); contact = within 3 rig px of it.'};
    files.push({name:tag+'/anchors.json',data:new TextEncoder().encode(cfgStringify({meta,frames})+'\n')});
    const a=document.createElement('a');a.href=URL.createObjectURL(zipStore(files));a.download='rig_'+tag+'.zip';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    say('Done: '+n+' frames, '+FW+'×'+FH+' px each → rig_'+tag+'.zip');
  }catch(e){console.error(e);say('Export failed: '+(e&&e.message||e),1);}
  finally{EXP.busy=false;btn.disabled=false;document.body.classList.remove('exporting');}
}
function buildFramesPanel(pn){
  const row=(lab,el)=>{const r=document.createElement('div'),l=document.createElement('span');r.className='row';l.textContent=lab;r.append(l,el,document.createElement('span'));pn.appendChild(r);};
  const sel=document.createElement('select');[1,2,3,4].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v+'×';o.selected=v===EXP.scale;sel.appendChild(o);});
  sel.onchange=()=>{EXP.scale=+sel.value;sel.blur();};
  const num=(min,max,val,on)=>{const i=document.createElement('input');i.type='number';i.min=min;i.max=max;i.step=1;if(val)i.value=val;i.oninput=()=>on(Math.max(min,Math.min(max,Math.round(+i.value)||0)));i.addEventListener('change',()=>i.blur());return i;};
  const fr=num(2,96,0,v=>{EXP.frames=v;}), pd=num(0,200,EXP.pad,v=>{EXP.pad=v;});
  const auto=()=>{if(P.cycleSec>0)fr.placeholder='auto ('+expAuto()+')';};syncers.push(auto);fr.onfocus=auto;
  row('Scale',sel);row('Frames / cycle',fr);row('Padding (rig px)',pd);
  const go=document.createElement('button');go.id='expGo';go.className='btn';go.textContent='⬇ Export frames (.zip)';go.onclick=e=>{exportFrames();e.target.blur();};
  const st=document.createElement('div');st.id='expStatus';st.className='note';
  const nt=document.createElement('div');nt.className='note';
  nt.textContent='Exports the current cycle (Run or Walk) as numbered transparent PNGs on one fixed canvas, plus anchors.json (neck, hands, feet, foot contact). It uses everything as set here: bag, strap, boots, sliders and speed. Floor line and pelvis sit on the same pixel in every frame, so the frames stack as layers. Frames: blank = about 24 fps, rounded so every key pose lands exactly on a frame (the first frame is the first key pose). Scale is a whole number of the 800 px art grid; pick 2× or more to paint over.';
  pn.append(go,st,nt);
}

  try{ await loadData(); }catch(e){ showLoadError(e); return; }
  applyArtBones();
  Object.assign(P,BASE);
  await loadArt();
  await loadAcc();
  loadGhost();
  resetGrids();resetFootGrids();
  buildDock('left',MENUS);
  resize();
  setCycle('run');
  pivSyncUI();
  updatePlay();
  let last=performance.now();
  (function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(S.playing) S.T+=dt*S.speed/P.cycleSec;
    render();requestAnimationFrame(frame);
  })(last);
})();
