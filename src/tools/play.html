   WORLD UNITS = CSS PX. THE PLAYER'S POSITION IS ITS FEET (BOTTOM CENTRE); THE HITBOX IS 35 x 65 WORLD PX.
   DONE:   RUN / JUMP / FALL / WALL SLIDE + WALL JUMP / DASH / DOUBLE JUMP / SPELL / KICK / AIR KICK, CAMERA, LEVEL.
   CHEAP FX (F2 TOGGLES ALL): SQUASH + STRETCH, HIT-STOP, CAMERA SHAKE, RUN / AIR MOTES, LANDING PUFF, DASH + AIR KICK AFTERIMAGES.

   PHYSICS NUMBERS COME FROM THE CHARACTER SHEET (library/characters/<name>/character.json, "physics" ROWS, MATCHED BY LABEL)
   WHEN RUN INSIDE THE WIZARD; THE DEFAULTS BELOW ARE THE ORIGINAL KAPLAY VALUES.
   ====================================================================== */

/* ---------- MOVES ---------- */

  moteColors: ['#00ffff', '#dc4ce8', '#A55AFF', '#c4b5fd', '#ff69b4'] };

const HIT_W = 35, HIT_H = 65;             // HITBOX IN WORLD PX, CENTRED ON THE FEET (MEASURED FROM THE KAPLAY BUILD)
const ONE_WAY_TOLERANCE = 4;
const CAM_Y_OFFSET = 120, CAM_LERP_SPEED = 6;
let LEVEL_MIN_X = 0, LEVEL_MAX_X = 13500;

const PLAYER_ANIMS = {

  run:        { sheet: 'run',        from: RUN.from, to: RUN.to, manual: true },
  jumpStart:  { sheet: 'jump',       from: JUMP_FRAME.start, to: JUMP_FRAME.start },
  jump:       { sheet: 'jump',       from: JUMP_FRAME.rise,  to: JUMP_FRAME.rise },
  doubleJump: { sheet: 'jump',       from: JUMP_FRAME.flip,  to: JUMP_FRAME.flip },
  fall:       { sheet: 'jump',       from: JUMP_FRAME.fall,  to: JUMP_FRAME.fall },
  land:       { sheet: 'jump',       from: JUMP_FRAME.land,  to: JUMP_FRAME.land },
  wallSlide:  { sheet: 'wall_slide', from: 0, to: 0 },
  attack:     { sheet: 'attack',     from: 0, to: 0, duration: ATTACK_HOLD_TIME },
  attackKick: { sheet: 'kick',       from: 0, to: PLAYER_SHEETS.kick.frames - 1, duration: ATTACK_KICK_HOLD_TIME, holds: KICK_FRAME_HOLDS },
  airKick:    { sheet: 'airKick',    from: 0, to: PLAYER_SHEETS.airKick.frames - 1, duration: AIR_KICK.holdTime, holds: AIR_KICK.holds },
};

/* ---------- LEVEL (SAME LAYOUT AS THE KAPLAY PLAYGROUND) ---------- */
const GROUND_Y = 460, GROUND_W = 16000, GROUND_H = 80, GROUND_TILE_W = 160;
const TILE_SIZE = 50, PLATFORM_H = 50, TILE_FRAME_COUNT = 6, TILE_SEED = 1337;
const COLUMN_FRAME = 50, COLUMN_TOP = 0, COLUMN_PLAIN = 1, COLUMN_RUNES = [2, 3, 4, 5], COLUMN_BASE = 6;
const COLUMN_SHAFT_INSET = 4, COLUMN_RUNE_CHANCE = 0.6, COLUMN_SEED = 4242;
const WALL_W = COLUMN_FRAME - COLUMN_SHAFT_INSET * 2;
const WALLS = [{ x: 4000, h: 400 }, { x: 12000 + 160, h: 440 }, { x: 12550, h: 400 }];
const PLATS = [
  { x: 700, y: 300, w: 200 }, { x: 500, y: 110, w: 160 }, { x: 550, y: 0, w: 200 }, { x: 3000, y: 300, w: 160 },
  { x: 4000, y: 330, w: 240 }, { x: 5000, y: 260, w: 160 }, { x: 6000, y: 300, w: 240 }, { x: 7000, y: 380, w: 160 },
  { x: 8000, y: 240, w: 200 }, { x: 9000, y: 300, w: 240 }, { x: 11000, y: 300, w: 280 },
];
const BG = '#030013';
let FALL_Y = GROUND_Y + 300, FLOOR_MAX = GROUND_Y, SPAWN = { x: 100, y: GROUND_Y };   // PER LEVEL: RESPAWN DEPTH, CAPE FLOOR CAP, WHERE THE PLAYER STARTS

function makeRng(seed) {   // MULBERRY32: THE SAME "RANDOM" TILE PATTERN AS THE KAPLAY BUILD
  let a = seed;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function floorBelow(x, y) { let f = Infinity; for (const s of solids) if (x >= s.x && x <= s.x + s.w && s.y >= y - 6 && s.y < f) f = s.y; return f; }   // TOP OF THE SOLID UNDER A POINT
const solids = [];    // { x, y, w, h }  BLOCK FROM EVERY SIDE (GROUND + WALLS)
const walls = [];     // SUBSET OF solids YOU CAN CLING TO, WITH ITS ART PIECES
const oneWays = [];   // { x, y, w, h, tiles[] }  SOLID ONLY WHEN LANDING FROM ABOVE
function buildLevel() {
  solids.push({ x: 0, y: GROUND_Y, w: GROUND_W, h: GROUND_H });
  const rand = makeRng(TILE_SEED); let prev = -1;
  const pickMid = () => { let f; do { f = Math.floor(rand() * TILE_FRAME_COUNT); } while (f === prev && TILE_FRAME_COUNT > 1); prev = f; return f; };
  PLATS.forEach(pd => { const cols = Math.ceil(pd.w / TILE_SIZE), tiles = []; for (let i = 0; i < cols; i++) tiles.push(pickMid()); oneWays.push({ x: pd.x, y: pd.y, w: pd.w, h: PLATFORM_H, tiles }); });
  const r2 = makeRng(COLUMN_SEED);
  WALLS.forEach(w => {
    const wall = { x: w.x, y: GROUND_Y - w.h, w: WALL_W, h: w.h, pieces: [] };
    const midH = Math.max(0, w.h - COLUMN_FRAME * 2), n = Math.max(1, Math.ceil(midH / COLUMN_FRAME)), pieceH = midH / n;
    if (midH > 0) for (let i = 0; i < n; i++) wall.pieces.push({ frame: r2() < COLUMN_RUNE_CHANCE ? COLUMN_RUNES[Math.floor(r2() * COLUMN_RUNES.length)] : COLUMN_PLAIN, y: COLUMN_FRAME + i * pieceH, h: pieceH });
    wall.pieces.push({ frame: COLUMN_TOP, y: 0, h: COLUMN_FRAME }, { frame: COLUMN_BASE, y: w.h - COLUMN_FRAME, h: COLUMN_FRAME });
    solids.push(wall); walls.push(wall);
  });
}

/* ---------- MAP LEVELS (A TILE LAB MAP FROM THE LIBRARY BECOMES THE LEVEL) ----------
   '#' -> SOLID (EVERY SOLID CAN BE CLUNG TO), '=' -> ONE-WAY LEDGE, '.' -> AIR. ONE CELL = MAP.cell WORLD PX (A 65 PX HITBOX FITS A 2-CELL GAP).
   map.spawn = [col,row] (THE PLAYER'S FEET SIT ON THE BOTTOM OF THAT CELL); NO SPAWN = THE FIRST FLOOR FOUND, LEFT TO RIGHT. */
const MAP = { on: false, cell: 64, grid: null, set: null, img: null, tile: 128, name: '' };
function defaultSpawn(g) {
  for (let x = 0; x < g.cols; x++) for (let y = 1; y < g.rows - 1; y++) if (g.kind(x, y) === '.' && g.kind(x, y - 1) === '.' && g.kind(x, y + 1) === '#') return [x, y];
  return [1, 1];
}
function mapSolids(g, C) {   // MERGE RUNS OF '#' INTO RECTS (ROW RUNS, THEN STACK EQUAL RUNS VERTICALLY)
  const out = [], open = new Map();
  for (let y = 0; y <= g.rows; y++) {
    const seen = new Set();
    for (let x = 0; x < g.cols && y < g.rows;) {
      if (g.kind(x, y) !== '#') { x++; continue; }
      let x2 = x; while (x2 < g.cols && g.kind(x2, y) === '#') x2++;
      const key = x + ':' + (x2 - x), r = open.get(key);
      if (r) r.h += C; else { const n = { x: x * C, y: y * C, w: (x2 - x) * C, h: C }; open.set(key, n); out.push(n); }
      seen.add(key); x = x2;
    }
    for (const k of [...open.keys()]) if (!seen.has(k)) open.delete(k);
  }
  return out;
}
function loadDefaultLevel() {
  solids.length = walls.length = oneWays.length = lamps.length = 0; MAP.on = false; MAP.grid = null; buildLevel(); lamps.push(...defaultLamps());
  LEVEL_MIN_X = 0; LEVEL_MAX_X = 13500; FALL_Y = GROUND_Y + 300; FLOOR_MAX = GROUND_Y; SPAWN = { x: 100, y: GROUND_Y };
}
async function loadMapLevel(m, name) {   // -> true WHEN THE MAP LOADED
  const def = OSWTiles.TILESETS[m && m.tileset] || OSWTiles.TILESETS.basic;
  if (!m || !Array.isArray(m.mask) || m.mask.length < 2 || m.mask.some(r => typeof r !== 'string' || r.length !== m.mask[0].length || /[^#.=]/.test(r))) throw new Error('not a Tile Lab map');
  let img = null; for (const src of def.srcs) { try { img = await loadImg(src); break; } catch (e) { /* TRY THE NEXT */ } }
  if (!img) throw new Error('could not load the map\'s tileset');
  const g = OSWTiles.makeGrid(m, def.layout), C = MAP.cell;
  solids.length = walls.length = oneWays.length = lamps.length = 0;
  for (const r of mapSolids(g, C)) { solids.push(r); walls.push(r); }
  const wallsEnd = { x: -100, y: -100, w: 100, h: g.rows * C + 200 }, wallsEndR = { x: g.cols * C, y: -100, w: 100, h: g.rows * C + 200 };
  for (const r of [wallsEnd, wallsEndR]) { solids.push(r); walls.push(r); }
  solids.push({ x: -100, y: -100, w: g.cols * C + 200, h: 100 });   // THE MAP'S EDGES ARE WALLS (NO CLIMBING OUT OF THE TOP)
  for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols;) {   // LEDGE RUNS -> ONE-WAY PLATFORMS
    if (g.kind(x, y) !== '=') { x++; continue; } let x2 = x; while (x2 < g.cols && g.kind(x2, y) === '=') x2++;
    oneWays.push({ x: x * C, y: y * C, w: (x2 - x) * C, h: C, tiles: [] }); x = x2;
  }
  let lastX = -99, n = 0;   // A TORCH ABOUT EVERY 8 COLUMNS, ON A FLOOR WITH 3 CELLS OF HEADROOM
  for (let x = 0; x < g.cols; x++) {
    if (x - lastX < 8) continue;
    for (let y = 2; y < g.rows - 1; y++) if (g.kind(x, y) === '.' && g.kind(x, y - 1) === '.' && g.kind(x, y - 2) === '.' && g.kind(x, y + 1) === '#') { lamps.push({ x: (x + 0.5) * C, y: (y + 1) * C, color: LAMP.colors[n % LAMP.colors.length], phase: n * 1.7 }); n++; lastX = x; break; }
  }
  MAP.on = true; MAP.grid = g; MAP.set = def; MAP.img = img; MAP.tile = Math.round(img.naturalWidth / 5); MAP.name = name || '';
  LEVEL_MIN_X = 0; LEVEL_MAX_X = g.cols * C; FALL_Y = g.rows * C + 400; FLOOR_MAX = Infinity;
  const sp = (Array.isArray(m.spawn) && g.kind(m.spawn[0], m.spawn[1]) !== '#') ? m.spawn : defaultSpawn(g);
  SPAWN = { x: (sp[0] + 0.5) * C, y: (sp[1] + 1) * C };
  return true;
}
function drawMapLevel(vl, vr) {
  const g = MAP.grid, C = MAP.cell, set = MAP.set, img = MAP.img, T = MAP.tile, ins = set.inset;
  const x0 = Math.max(0, Math.floor(vl / C)), x1 = Math.min(g.cols - 1, Math.floor(vr / C)), y0 = Math.max(0, Math.floor((cam.y - H / 2 - 60) / C)), y1 = Math.min(g.rows - 1, Math.floor((cam.y + H / 2 + 60) / C));
  const { pick, drawTile } = OSWTiles;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {   // AIR + BACK WALL
    if (g.kind(x, y) === '#' || g.over.has(x + ',' + y)) continue;
    drawTile(ctx, img, T, pick(set.air, x, y), false, x * C, y * C, C, ins);
    drawTile(ctx, img, T, pick(set.back, x, y), false, x * C, y * C, C, ins);

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const t = g.tileAt(x, y); if (t) drawTile(ctx, img, T, t.i, t.fx, x * C, y * C, C, ins); }
}

/* ---------- ASSETS ---------- */
const IMG = {};            // name -> HTMLImageElement
const sheetScales = {};    // SCALE-TO-FIT PER SHEET (1 WHEN IT IS ALREADY 400 TALL)
const footGaps = {};       // PER-FRAME PX BETWEEN THE LOWEST VISIBLE PIXEL AND THE CELL BOTTOM (snapFeet SHEETS ONLY)
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('could not load ' + src)); im.src = src; });
function measureFootGaps(key, img, frames) {   // SCANS THE SHEET ONCE. FAILS SOFT (USE offsetY INSTEAD)
  try {
    const cw = Math.floor(img.width / frames), ch = img.height, cv = document.createElement('canvas'); cv.width = img.width; cv.height = ch;
    const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(img, 0, 0); const px = cx.getImageData(0, 0, img.width, ch).data, gaps = [];
    for (let f = 0; f < frames; f++) { let bottom = -1; for (let y = ch - 1; y >= 0 && bottom < 0; y--) for (let x = f * cw; x < (f + 1) * cw; x++) if (px[(y * img.width + x) * 4 + 3] > FOOT_ALPHA_MIN) { bottom = y; break; } gaps.push(bottom < 0 ? 0 : ch - 1 - bottom); }
    footGaps[key] = gaps;
  } catch (e) { console.warn('[play] ' + key + ': could not measure foot gaps (' + e.message + ')'); }
}
async function loadAssets() {
  for (const [key, sh] of Object.entries(PLAYER_SHEETS)) {
    const im = await loadImg(SHEET_DIR + sh.src); IMG[key] = im; sheetScales[key] = PLAYER_FRAME / im.naturalHeight;
    const tw = sheetTweak(key); if (tw.snapFeet || (tw.snapFrames && tw.snapFrames.length)) measureFootGaps(key, im, sh.frames);
  }
  IMG.spell = await loadImg(SPELL.src); IMG.swoosh = await loadImg(SWOOSH.src); IMG.puff = await loadImg(PUFF.src); IMG.spawn = await loadImg(SPAWN_FX.src); IMG.torch = await loadImg(TORCH.src); IMG.flame = await loadImg(TORCH.flameSrc); IMG.cloakBack = await loadImg(CLOAK.backSrc); IMG.cloakFront = await loadImg(CLOAK.frontSrc);
  IMG.ground = await loadImg('assets/images/map/pillars.png'); IMG.tiles = await loadImg('assets/images/map/tiles.png'); IMG.column = await loadImg('assets/images/map/column.png');
}
function sheetTweak(key) { return (PLAYER_SHEET_TWEAKS[key] = PLAYER_SHEET_TWEAKS[key] || { scale: 1, offsetX: 0, offsetY: 0, snapFeet: false }); }
function sheetPlace(key, frame, flip) {   // s = FINAL SCALE, ox / oy = LOCAL PX SHIFT (FORWARD-MIRRORED / DOWN)
  const tw = sheetTweak(key), s = (sheetScales[key] || 1) * tw.scale, snap = tw.snapFeet || (tw.snapFrames && tw.snapFrames.includes(frame));
  const gap = snap ? ((footGaps[key] && footGaps[key][frame]) || 0) : 0;
  return { s, ox: (flip ? -1 : 1) * tw.offsetX, oy: gap * s + tw.offsetY };
}

/* ---------- INPUT ---------- */
const keys = new Set(), pressQ = [];
const KEY_NAMES = { arrowleft: 'left', arrowright: 'right', arrowup: 'up', ' ': 'space', spacebar: 'space' };
const USED = new Set(['left', 'right', 'up', 'a', 'd', 'w', 'space', 'shift', 'c', 'z', 'x', 'r', 'f1', 'f2', 'v', 'g', 'l']);
const keyName = e => { const k = (e.key || '').toLowerCase(); return KEY_NAMES[k] || k; };
addEventListener('keydown', e => { if (e.ctrlKey || e.metaKey || e.altKey) return; const k = keyName(e); if (!USED.has(k)) return; e.preventDefault(); if (!keys.has(k) && !e.repeat) pressQ.push(k); keys.add(k); });

/* ---------- ANIMATION ---------- */

/* ---------- ONE FIXED STEP ---------- */

    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.dir * scale, scale); ctx.drawImage(img, i * cw, 0, cw, ch, -cw / 2, -ch / 2, cw, ch); ctx.restore();   // CENTRE-ANCHORED
  }
}
function drawSwooshes() {   // BOTTOM-ANCHORED, SAME CELL SIZE AS THE PLAYER FRAME
  for (const f of swooshes) {
    const i = Math.min(SWOOSH.frames - 1, Math.floor(f.t * SWOOSH.fps)), cw = IMG.swoosh.naturalWidth / SWOOSH.frames, ch = IMG.swoosh.naturalHeight, s = SCALE * SWOOSH.scale;
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.dir * s, s); ctx.drawImage(IMG.swoosh, i * cw, 0, cw, ch, -cw / 2, -ch, cw, ch); ctx.restore();
  }
}
function drawHud() {
  ctx.font = '12px Consolas, monospace'; ctx.textBaseline = 'top';
  const lines = [
    'grounded: ' + P.grounded + '   anim: ' + currentAnim + '   sheet: ' + P.sheet + ' frame ' + P.frame,
    'vel.y: ' + P.vy.toFixed(1) + '   pos: ' + P.x.toFixed(0) + ', ' + P.y.toFixed(1) + '   isAttacking: ' + isAttacking,
    'wall: ' + (touching ? touching.dir : '-') + '   wallJumpLock: ' + wallJumpLock.toFixed(2) + '   air jump: ' + (airJumpReady ? 'ready' : 'used') + '   air kick: ' + (airKick.t > 0 ? airKick.t.toFixed(2) + 's' : airKickReady ? 'ready' : 'used') + '   dash: ' + (dashTimer > 0 ? 'ON' : dashCooldown > 0 ? 'cooldown' : 'ready'),
    'physics: ' + physSource,
    'move ' + PHYS.move + '  jump ' + PHYS.jump + '  gravity ' + PHYS.gravity + '  maxFall ' + PHYS.maxFall + '  wallSlide ' + PHYS.wallSlide + '  wallJump ' + PHYS.wallJump + '  airCtl ' + PHYS.airControl + '  coyote ' + Math.round(PHYS.coyote * 1000) + 'ms',
    'fx: ' + (FX.on ? 'ON' : 'OFF') + '   dissolve ' + dissolveAmount.toFixed(2) + '   squash ' + squash.x.toFixed(2) + ' x ' + squash.y.toFixed(2) + '   particles ' + particles.length + '   ghosts ' + ghosts.length + '   F2 toggles',
    'light (L): ' + (lighting.on ? 'on' : 'off') + '   cape (V): ' + CAPE_MODES[cape.mode] + '   ghost tail (G): ' + (CAPE_DISSOLVE.enabled ? 'on' : 'off') + '   spring ' + cape.spring.a.toFixed(1) + 'deg',
    'arrows/WASD move   up/W/space jump (again = double jump, on a wall = wall jump)   shift/C dash   Z spell   X kick   R respawn   F1 hitboxes',
  ];
  lines.forEach((t, i) => { ctx.fillStyle = i === lines.length - 1 ? '#657383' : '#00ffff'; ctx.fillText(t, 20, 20 + i * 15); });
}
function render(alpha) {
  const x = P.px + (P.x - P.px) * alpha, y = P.py + (P.y - P.py) * alpha;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.save(); ctx.translate(Math.round(W / 2 - cam.x - shake.x), Math.round(H / 2 - cam.y - shake.y));
  drawLevel(cam.x - W / 2 - 60, cam.x + W / 2 + 60);
  drawTorches(cam.x - W / 2, cam.x + W / 2);                              // z 3
  drawParticles();                                                        // z 8
  drawGhosts();                                                           // z 9
  drawSheetFx(spells, IMG.spell, SPELL.frames, SPELL.fps, SPELL.scale);   // z 9: BEHIND THE PLAYER
  drawCloth(x, y);                                                        // z 9.5: THE VERLET CAPE, BEHIND THE BODY
  drawPlayer(x, y);
  drawOneShots(true);                                                     // z 11: THE SPAWN BEAM
  drawSwooshes();                                                         // z 11: IN FRONT
  if (showHitboxes) {
    ctx.lineWidth = 1; ctx.strokeStyle = '#ff69b4'; solids.forEach(s => ctx.strokeRect(s.x + .5, s.y + .5, s.w, s.h));
    ctx.strokeStyle = '#58e84c'; oneWays.forEach(o => ctx.strokeRect(o.x + .5, o.y + .5, o.w, o.h));
    ctx.strokeStyle = '#00ffff'; ctx.strokeRect(x - HIT_W / 2 + .5, y - HIT_H + .5, HIT_W, HIT_H);
  }
  ctx.restore(); drawLighting(x, y, cam.x + shake.x, cam.y + shake.y); drawHud();
}

/* ---------- LOOP ---------- */
let last = 0, acc = 0, paused = false;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  clockT = now / 1000;
  const frozen = hitStopT > 0; if (frozen) { hitStopT -= dt; acc = 0; }   // HIT-STOP: THE SIMULATION AND THE CAMERA FOLLOW STAND STILL, THE SHAKE KEEPS GOING
  if (!paused && !frozen) {
    acc += dt; let n = 0;
    while (acc >= FIXED_DT && n++ < 8) { tick(FIXED_DT); acc -= FIXED_DT; if (hitStopT > 0) { acc = 0; break; } }
    if (n >= 8) acc = 0;   // A LONG STALL (TAB SWITCH): DROP THE BACKLOG INSTEAD OF SPIRALLING
  }
  stepShake(dt);
  const alpha = acc / FIXED_DT, tx = P.px + (P.x - P.px) * alpha, ty = P.py + (P.y - P.py) * alpha - CAM_Y_OFFSET, k = frozen ? 0 : Math.min(1, dt * CAM_LERP_SPEED);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  render(alpha); requestAnimationFrame(frame);
}

/* ---------- CHARACTER PHYSICS (library/characters/<name>/character.json) ---------- */
function applyPhysics(rows, label) {
  Object.assign(PHYS, DEFAULT_PHYS); let n = 0;
  for (const r of Array.isArray(rows) ? rows : []) {
    const m = LABEL_KEYS[String(r && r.label || '').toLowerCase().replace(/[^a-z]/g, '')], v = Number(r && r.value);
    if (!m || !isFinite(v)) continue;
    const [key, div, lo, hi] = m, val = v / div; if (val < lo / div || val > hi / div) continue;   // OUT OF RANGE ROWS ARE IGNORED, NOT CLAMPED
    PHYS[key] = val; n++;
  }
  physSource = label ? label + ' (' + n + ' sheet rows applied)' : 'defaults (Kaplay values)';
}
async function useCharacter(slug) {
  if (!slug) { applyPhysics(null, ''); return; }
  try { const c = await OSWClient.library.character.get(slug); applyPhysics(c && c.physics, slug + '/character.json'); if (!c) physSource = slug + ' has no character.json, using defaults'; }
  catch (e) { applyPhysics(null, ''); physSource = 'defaults (library error: ' + (e.message || e) + ')'; }
}
async function initMaps() {
  if (!(window.OSWClient && OSWClient.hosted)) return;
  const sel = document.getElementById('mapSel'); let names = [];
  const fill = async () => {
    try { names = await OSWClient.library.map.list(); } catch (e) { names = []; }
    const cur = sel.value; sel.innerHTML = '';
    [['', 'test level'], ...names.map(s => [s, s])].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); });
    sel.value = names.includes(cur) ? cur : '';
    sel.hidden = false; document.getElementById('mapLbl').hidden = false;
  };
  const use = async name => {
    try {
      if (!name) loadDefaultLevel(); else { const m = await OSWClient.library.map.get(name); if (!m) { loadDefaultLevel(); sel.value = ''; } else await loadMapLevel(m, name); }
    } catch (e) { console.warn('[play] map ' + name + ': ' + e.message); loadDefaultLevel(); sel.value = ''; }
    spawnPlayer(); cam.x = P.x; cam.y = P.y - CAM_Y_OFFSET;
  };
  await fill();
  let pref = ''; try { pref = localStorage.getItem('playMap_v1') || ''; } catch (e) { /* STORAGE CAN BE UNAVAILABLE */ }
  if (names.includes(pref)) { sel.value = pref; await use(pref); }
  sel.onchange = async () => { sel.blur(); cv.focus(); try { localStorage.setItem('playMap_v1', sel.value); } catch (e) { /* IGNORE */ } await use(sel.value); };
  let t = 0;   // RE-SAVING THE MAP YOU ARE PLAYING IN TILE LAB RELOADS IT
  OSWClient.on('library.changed', c => { if (!c || c.kind !== 'map') return; clearTimeout(t); t = setTimeout(async () => { await fill(); if (c.id === sel.value) await use(c.id); }, 300); });
}
async function initCharacters() {
  if (!(window.OSWClient && OSWClient.hosted)) return;
  const sel = document.getElementById('charSel'); let slugs = [];
  const fill = async () => {
    try { slugs = await OSWClient.library.character.list(); } catch (e) { slugs = []; }
    const cur = sel.value; sel.innerHTML = '';
    [['', 'defaults (Kaplay values)'], ...slugs.map(s => [s, s])].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); });
    sel.value = slugs.includes(cur) ? cur : '';
    sel.hidden = false; document.getElementById('uiLbl').hidden = false;
  };
  await fill();
  let pref = ''; try { pref = localStorage.getItem('playChar_v1') || ''; } catch (e) { /* STORAGE CAN BE UNAVAILABLE */ }
  const want = slugs.includes(pref) ? pref : (slugs.includes('nova') ? 'nova' : slugs[0] || '');
  sel.value = want; await useCharacter(want);
  sel.onchange = async () => { sel.blur(); cv.focus(); try { localStorage.setItem('playChar_v1', sel.value); } catch (e) { /* IGNORE */ } await useCharacter(sel.value); };
  let t = 0;   // A SAVE IN THE CHARACTER BUILDER (OR A NEW CHARACTER) UPDATES THE NUMBERS LIVE, NO RESPAWN
  OSWClient.on('library.changed', () => { clearTimeout(t); t = setTimeout(async () => { await fill(); await useCharacter(sel.value); }, 300); });
}

/* ---------- BOOT ---------- */
function showError(e) { const d = document.createElement('div'); d.id = 'err'; d.textContent = 'PLAY load error: ' + e.message + '. Serve the folder over http (the app does; plain file:// cannot read the sprite sheets).'; document.body.appendChild(d); }
(async function () {
  resize(); loadDefaultLevel();
  try { await loadAssets(); } catch (e) { showError(e); return; }
  spawnPlayer(); cam.x = P.x; cam.y = P.y - CAM_Y_OFFSET;
  initCharacters(); initMaps();
  cv.focus(); addEventListener('pointerdown', () => cv.focus());
  window.__play = { MAP, loadMap: async (m, n) => { await loadMapLevel(m, n); spawnPlayer(); cam.x = P.x; cam.y = P.y - CAM_Y_OFFSET; }, loadDefault: () => { loadDefaultLevel(); spawnPlayer(); cam.x = P.x; cam.y = P.y - CAM_Y_OFFSET; }, get SPAWN() { return SPAWN; }, lighting, lamps, render: () => render(0.5), collectLights, dissolve: () => ({ amount: dissolveAmount, out: dissolvingOut }), doubleJump, cape, cloth, CAPE_DISSOLVE, FX, squash, particles, ghosts, puffs, shake, hitStop: () => hitStopT, P, PHYS, keys, tick, solids, walls, oneWays, spawnPlayer, applyPhysics, state: () => ({ currentAnim, isAttacking, touching, dashTimer, airJumpReady, airKickReady, wallSlideHOffset, landTimer, physSource, doubleJump: { t: doubleJump.t, angle: doubleJump.angle } }), pause: v => { paused = v; } };
  last = performance.now(); requestAnimationFrame(frame);
})();
</script>
