<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">  <!-- OSW: RESOLVES assets/ FROM src/ WHETHER RUN IN THE APP OR OPENED FROM src/tools/ -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAPE LAB // NOVA2</title>
<style>
/* ---------- THEME: DEEP VIOLET + NEON (PALETTE FROM colorPalette/) ---------- */
:root{--bg:#0c001f;--panel:rgba(23,0,50,.88);--line:#37025a;--ink:#C4C3D0;--dim:#9090C0;--cyan:#00ffff;--mag:#dc4ce8;--vio:#A55AFF;--mint:#67FEBD;--warn:#ff6200}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.drag{cursor:grabbing}
#hud{position:fixed;left:12px;top:10px;pointer-events:none;text-shadow:0 0 6px #000}
#hud h1{margin:0 0 4px;font-size:15px;letter-spacing:.22em;color:var(--cyan);font-weight:700}
#hud h1 span{color:var(--mag)}
#hud .keys{color:var(--dim);max-width:420px}
#hud .keys b{color:var(--vio);font-weight:600}
#meter{margin-top:8px;padding:6px 8px;border:1px solid var(--line);background:rgba(12,0,31,.7);width:250px}
#meter div{display:flex;justify-content:space-between}
#meter .v{color:var(--mint)}
#meter .bad{color:var(--warn)}
#meter small{color:var(--dim)}
#panel{position:fixed;right:0;top:0;bottom:0;width:310px;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 10px 24px;backdrop-filter:blur(3px)}
#panel.hide{display:none}
#panel details{border-bottom:1px solid var(--line);padding:4px 0}
#panel summary{cursor:pointer;color:var(--cyan);letter-spacing:.12em;font-weight:700;padding:3px 0;text-transform:uppercase;font-size:11px}
.row{display:grid;grid-template-columns:104px 1fr 44px;gap:6px;align-items:center;margin:3px 0}
.row label{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{text-align:right;color:var(--mint)}
.row2{display:grid;grid-template-columns:104px 1fr;gap:6px;align-items:center;margin:3px 0}
input[type=range]{width:100%;accent-color:var(--vio);height:14px;margin:0}
select,button,input[type=color]{background:#170032;color:var(--ink);border:1px solid var(--line);font:inherit;padding:3px 6px}
input[type=color]{padding:0;height:22px;width:60px}
button{cursor:pointer}
button:hover{border-color:var(--cyan);color:var(--cyan)}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
.hint{color:var(--dim);font-size:11px;margin:2px 0 4px}
#dlg{position:fixed;inset:0;background:rgba(12,0,31,.82);display:none;align-items:center;justify-content:center;z-index:5}
#dlg.on{display:flex}
#dlg div{width:min(560px,90vw);background:#170032;border:1px solid var(--vio);padding:12px;box-shadow:0 0 24px rgba(165,90,255,.35)}
#dlg h3{margin:0 0 6px;font-size:12px;letter-spacing:.16em;color:var(--cyan)}
#dlg textarea{width:100%;height:240px;box-sizing:border-box;background:#0c001f;color:var(--ink);border:1px solid var(--line);font:11px/1.35 ui-monospace,Consolas,monospace;resize:vertical}
#lib input[type=text]{width:100%;background:#170032;color:var(--ink);border:1px solid var(--line);font:inherit;padding:3px 6px}
#lib select{width:100%}
#msg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 12px;background:rgba(12,0,31,.9);border:1px solid var(--mag);color:var(--mag);display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>CAPE LAB <span>//</span> <span id="bodyName" style="color:var(--cyan)">NOVA2</span></h1>
  <div class="keys"><b>A/D</b> or <b>&larr;/&rarr;</b> move &nbsp; <b>W/&uarr;/Space</b> jump &nbsp; <b>Shift</b> dash &nbsp; <b>drag</b> the body with the mouse<br>
  <b>T</b> autopilot stress test &nbsp; <b>R</b> reset &nbsp; <b>G</b> debug overlay &nbsp; <b>F</b> slow-mo &nbsp; <b>P</b> pause &nbsp; <b>X</b> clear peaks &nbsp; <b>H</b> hide panel</div>
  <div id="meter"></div>
</div>
<div id="panel"></div>
<div id="msg"></div>
<div id="dlg"><div><h3 id="dlgT"></h3><textarea id="dlgTa" spellcheck="false"></textarea><div class="btns" style="margin:6px 0 0;padding:0;border:0;background:none;width:auto;box-shadow:none"><button id="dlgOk">OK</button><button id="dlgNo">CLOSE</button></div></div></div>

<script src="js/oswClient.js"></script>
<script src="js/capeSim.js"></script>
<script>
/* =====================================================================
   CONFIG - ART + COLLIDERS (ALL IN 400x400 ART PIXELS OF assets/images/nova/Nova2.png)
   NOVA2.png IS AT THE SAME ART SCALE AS PLAY'S 400 PX SPRITE SHEETS (SAME FOOT BASELINE y399, SAME FEET CENTRE x~235), SO 1 ART PX HERE = 1 SPRITE ART PX IN PLAY.
   WITH B.scale = 0.5 (PLAY'S SCALE) 1 WORLD PX HERE = 1 WORLD PX IN PLAY.
   ===================================================================== */
const BODY_SRC = "assets/images/nova/Nova2.png";
const ART = { w: 400, h: 400, px: 235, py: 399, box: [191, 74, 275, 399] };            // PIVOT = FEET CENTER OF THE BODY (BBOX IS x191-275, y74-399)
const COLLIDERS_ART = [                                      // CIRCLES THE CAPE CAN'T SINK INTO (EDIT IF THE ART CHANGES; G SHOWS THEM). STARTING POINT = nova's SAVED CIRCLES CONVERTED FROM THE 800 PX RIGHT VIEW (x0.5, FEET-ANCHORED), HEAD NUDGED UP FOR THE HOOD EARS
  { x: 228, y: 116, r: 36 },                                 // HEAD + HOOD MASS
  { x: 234, y: 188, r: 19 },                                 // CHEST
  { x: 232, y: 228, r: 15 },                                 // WAIST / BAG
  { x: 231, y: 272, r: 13 },                                 // THIGH
  { x: 229, y: 307, r: 11 },                                 // KNEE
];

/* =====================================================================
   SETTINGS - EVERY SLIDER LIVES IN ONE OF THESE OBJECTS (COPY SETTINGS EXPORTS THEM)
   ===================================================================== */
const B = {            // BODY (scale 0.5 = PLAY'S SCALE FOR THE 400 PX SPRITE ART)
  scale: 0.5, maxSpeed: 560, accel: 3200, friction: 3000, airCtl: 0.8,
  jumpV: 1000, gravity: 2800, dashMul: 1.7,
};
const C = {            // CAPE SIM (WORLD PX; SEE ALSO anti-curl BLOCK)
  segments: 12, segLen: 7.5, gravity: 1800, drag: 1.2, nDrag: 9, tDrag: 0.4,
  lift: 0.55, flutter: 260, backBias: 0, wind: 0,
  hangDeg: 17, sag: 0.55, vRef: 500, restPull: 45,
  iterations: 8, bend: 0.35, step: 1 / 120, maxSteps: 6,
  // ANTI-CURL
  spanMin: 0.5, maxBendDeg: 28, collide: true, thick: 6,
  turnMode: "slide", turnTime: 0.16,
  // GROUND
  groundPad: 14, groundFric: 0.35,
  // ATTACH
  attach: "two", shear: 1.0, rung: 0.3,
};
const L = {            // LOOK
  w1: 53, taper: 1.0, ripple: 0.06, split: 0.55,
  top: "#1d54ed", bottom: "#1a4fda", rim: "#1078f0", dark: "#1040b8",
  rimW: 3, folds: true, layer: "behind",
  // GHOST TAIL (DISSOLVE). disStart: 0 = ROOT, 1 = HEM. disAmt: HOW GONE THE HEM GETS (1 = FULLY).
  dis: true, disStart: 0.62, disAmt: 0.9, disCell: 14, disEdge: 0.22, disFlow: 70, disSpeed: 0.5, disFade: 0.3, disGlow: 1.0,
  mode: "tendrils", tCount: 5, tSplit: 0.4, tAmp: 28, tSpeed: 5, tSpread: 0.45, tTaper: 0.8, tOverlap: 0.35, tLenVar: 0.3, tWaves: 1.25, tIdle: 0.45, tGain: 0.9,
  disSparks: 0.3, disColA: "#c8fcff", disColB: "#dc4ce8",
};
const PIN = { ax: 206, ay: 163, bx: 239, by: 163 };           // THE TWO PINK MARKERS: CLOAK ATTACH POINTS (ART PX). STARTING POINT = nova's SAVED PINS CONVERTED FROM THE 800 PX RIGHT VIEW. 1-PIN MODE USES THEIR MIDPOINT. IN DEBUG MODE (G) DRAG THE DOTS.

const PRESETS = {
  STABLE: {},
  OLD: { // INDEX.HTML MODE 2 RECIPE: NO RELATIVE-WIND DRAG, NO REST SHAPE, NO ANGLE LIMITS, NAIVE FLIP
    C: { segments: 12, segLen: 11, gravity: 2000, drag: 3.6, nDrag: 0, tDrag: 0, lift: 0.8, flutter: 1400, backBias: 2000,
         restPull: 0, iterations: 6, bend: 0.32, spanMin: 0, maxBendDeg: 180, collide: false, turnMode: "snap", turnTime: 0, sag: 0.55, attach: "one" },
  },
  LOOSE: { // STABLE BUT FLOPPY: SEE HOW MUCH THE LIMITS ARE DOING
    C: { restPull: 0, spanMin: 0.3, maxBendDeg: 50, nDrag: 5 },
  },
};
const DEFAULTS = JSON.parse(JSON.stringify({ B, C, L, PIN }));
// BODIES: NOVA2 (assets/images/nova/Nova2.png, SPRITE-SHEET ART SCALE) IS THE BUILT-IN TEST BODY. A CHARACTER BODY COMES FROM THE LIBRARY (ITS side VIEW PNG) + ITS character.json "cape" BLOCK (PINS, COLLIDERS, DEFAULTS), ALL IN THAT VIEW'S PIXELS.
// THE BUILT-IN ID IS "nova2" (NOT THE OLD "blob") SO A STALE localStorage / SAVED FILE MADE ON THE BLOB DROPS ITS PINS AND SCALE INSTEAD OF APPLYING THEM TO THIS ART.
const BUILTIN_ID = "nova2";
const BUILTIN_BODY = JSON.parse(JSON.stringify({ id: BUILTIN_ID, name: "NOVA2", src: BODY_SRC, art: { w: ART.w, h: ART.h, px: ART.px, py: ART.py }, box: ART.box, colliders: COLLIDERS_ART, pins: PIN, defaults: null }));
let bodyId = BUILTIN_ID, bodyPins = { ...PIN }, bodyObjUrl = null, bodySel = null, targetSel = null;
let bodySpace = "sprite";   // WHICH PIXELS PIN / COLLIDERS ARE IN: "sprite" = NOVA2.png = THE 400 PX SPRITE-SHEET CELLS (PLAY USES THEM 1:1), "view" = A CHARACTER'S 800 PX SIDE-VIEW PNG (PLAY CONVERTS WITH A SCALE k)

/* =====================================================================
   SIM: THE VERLET CLOTH LIVES IN js/capeSim.js (ONE COPY, SHARED WITH PLAY). THESE ARE THE PIECES THIS PAGE USES.
   ===================================================================== */
const { TAU, wrapA, capeReset, capeMirror, capeRefDir, capeStep, capeMetrics, quadArea } = CapeSim;

/* =====================================================================
   BLOB + WORLD STATE
   ===================================================================== */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, groundY = 0;
const img = new Image(); let imgOK = false;
img.onload = () => { imgOK = true; }; img.onerror = () => { imgOK = false; flash("COULD NOT LOAD THE BODY ART - USING PLACEHOLDER. SERVE src/ OVER HTTP."); };
img.src = BODY_SRC;

const blob = { x: 0, y: 0, vx: 0, vy: 0, facing: 1, faceS: 1, turnFrom: 1, grounded: true, sq: 0, sqv: 0, turnT: 1, dragging: false };
const cape = { p: [], t: 0, acc: 0, last: null, vel: { x: 0, y: 0 } };
const cam = { x: 0 };
const peak = { worst: 0, total: 0, cross: 0, twist: 0, crossFrames: 0, frames: 0 };
const ui = { debug: false, paused: false, slow: false, auto: false, panel: true, timeScale: 1, fps: 60 };
const keys = {}; let jumpPressed = false, autoT = 0, autoI = 0, autoJumped = false;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  groundY = Math.round(H * 0.8);
  if (blob.grounded) blob.y = groundY;
}
window.addEventListener("resize", resize);

// ART PX -> WORLD PX. ONE FUNCTION USED BY THE DRAWING *AND* THE CAPE ROOT, SO THE PIN CAN'T DRIFT OFF THE ART.
function artToWorld(ax, ay) {
  const k = B.scale, sx = 1 - blob.sq * 0.6, sy = 1 + blob.sq;
  return { x: blob.x + (ax - ART.px) * k * sx * blob.faceS, y: blob.y + (ay - ART.py) * k * sy };
}
function worldToArt(wx, wy) {
  const k = B.scale, sx = 1 - blob.sq * 0.6, sy = 1 + blob.sq;
  return { x: ART.px + (wx - blob.x) / (k * sx * blob.facing), y: ART.py + (wy - blob.y) / (k * sy) };
}
const pinAW = () => artToWorld(PIN.ax, PIN.ay), pinBW = () => artToWorld(PIN.bx, PIN.by);
function pinsWorld() { // ONE PIN (MIDPOINT) OR TWO PINS (THE ENDS OF THE CLOAK'S BACK EDGE)
  const a = pinAW(), b = pinBW();
  return C.attach === "one" ? [{ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }] : [a, b];
}
function widthsWorld() { // CAPE WIDTH ALONG ITS LENGTH: STARTS AS THE DISTANCE BETWEEN THE PINS, TAPERS TO THE HEM WIDTH
  const a = pinAW(), b = pinBW(), w0 = Math.hypot(b.x - a.x, b.y - a.y), n = C.segments, out = [];
  for (let i = 0; i < n; i++) out.push(lerp(w0, L.w1, Math.pow(i / (n - 1), L.taper)));
  return out;
}
const collidersWorld = () => COLLIDERS_ART.map((c) => { const p = artToWorld(c.x, c.y); return { x: p.x, y: p.y, r: c.r * B.scale }; });

function resetAll() {
  blob.x = 0; blob.y = groundY; blob.vx = blob.vy = 0; blob.facing = blob.faceS = blob.turnFrom = 1; blob.grounded = true; blob.sq = blob.sqv = 0; blob.turnT = 1;
  cam.x = blob.x - viewW() / 2;
  cape.vel = { x: 0, y: 0 };
  capeReset(cape, C, pinsWorld(), blob.facing);
  clearPeaks();
}
const viewW = () => W - (ui.panel ? 310 : 0);
function clearPeaks() { peak.worst = peak.total = peak.cross = peak.twist = peak.twistFrames = peak.crossFrames = peak.frames = 0; }

/* =====================================================================
   INPUT
   ===================================================================== */
const AUTO = [ // STRESS SCRIPT: LONG RUNS, HARD REVERSALS, TAP-TAP-TAP, JUMPS MID-RUN, DASHES. d = DIRECTION, t = SECONDS
  { d: 1, t: 1.3 }, { d: -1, t: 1.3 }, { d: 1, t: 0.9, j: 1 }, { d: -1, t: 0.22 }, { d: 1, t: 0.22 }, { d: -1, t: 0.22 }, { d: 1, t: 0.22 },
  { d: 0, t: 0.8 }, { d: 1, t: 0.9, dash: 1 }, { d: -1, t: 0.9, dash: 1 }, { d: 0, t: 0.5, j: 1 }, { d: -1, t: 1.0, j: 1 }, { d: 1, t: 0.15 }, { d: -1, t: 0.7, j: 1 }, { d: 0, t: 0.9 },
];
function getInput(dt) {
  if (ui.auto) {
    autoT += dt; let s = AUTO[autoI];
    while (autoT >= s.t) { autoT -= s.t; autoI = (autoI + 1) % AUTO.length; s = AUTO[autoI]; autoJumped = false; }
    const jp = !!s.j && !autoJumped; if (jp) autoJumped = true;
    return { dir: s.d, dash: !!s.dash, jumpPressed: jp, jumpHeld: !!s.j && autoT < 0.4 };
  }
  const dir = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const jp = jumpPressed; jumpPressed = false;
  return { dir, dash: !!keys.shift, jumpPressed: jp, jumpHeld: !!(keys.w || keys.arrowup || keys[" "]) };
}
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
  if (!keys[k] && (k === "w" || k === "arrowup" || k === " ")) jumpPressed = true;
  keys[k] = true;
  if (e.repeat) return;
  if (k === "r") resetAll();
  else if (k === "g") ui.debug = !ui.debug;
  else if (k === "p") ui.paused = !ui.paused;
  else if (k === "f") { ui.slow = !ui.slow; ui.timeScale = ui.slow ? 0.25 : 1; flash(ui.slow ? "SLOW-MO 0.25x" : "NORMAL SPEED"); }
  else if (k === "t") { ui.auto = !ui.auto; autoT = 0; autoI = 0; autoJumped = false; clearPeaks(); flash(ui.auto ? "AUTOPILOT ON (T TO STOP)" : "AUTOPILOT OFF"); }
  else if (k === "x") clearPeaks();
  else if (k === "h") { ui.panel = !ui.panel; document.getElementById("panel").classList.toggle("hide", !ui.panel); }
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// MOUSE: GRAB THE BLOB AND THROW IT; IN DEBUG MODE (G) DRAG A PIN DOT TO MOVE THAT ATTACH POINT
const mouse = { x: 0, y: 0, lx: 0, ly: 0, vx: 0, vy: 0, grab: null, pin: null, col: null };
const toWorld = (e) => ({ x: e.clientX + cam.x, y: e.clientY });
cv.addEventListener("mousedown", (e) => {
  const m = toWorld(e); mouse.x = mouse.lx = m.x; mouse.y = mouse.ly = m.y;
  if (ui.debug) { const A = pinAW(), Bw = pinBW(); if (Math.hypot(m.x - A.x, m.y - A.y) < 16) { mouse.pin = "a"; return; } if (Math.hypot(m.x - Bw.x, m.y - Bw.y) < 16) { mouse.pin = "b"; return; }
    const ac = worldToArt(m.x, m.y);                         // BODY COLLIDER CIRCLES: GRAB BY THE CENTRE DOT
    for (let i = 0; i < COLLIDERS_ART.length; i++) { const c = COLLIDERS_ART[i]; if (Math.hypot(ac.x - c.x, ac.y - c.y) * B.scale < 14) { mouse.col = i; return; } } }
  const a = worldToArt(m.x, m.y), bx = ART.box;
  if (a.x > bx[0] - 12 && a.x < bx[2] + 12 && a.y > bx[1] - 12 && a.y < bx[3] + 12) { blob.dragging = true; mouse.grab = { x: blob.x - m.x, y: blob.y - m.y }; cv.classList.add("drag"); }
});
window.addEventListener("mousemove", (e) => { const m = toWorld(e); mouse.x = m.x; mouse.y = m.y; });
window.addEventListener("mouseup", () => {
  if (blob.dragging) { blob.vx = clamp(mouse.vx, -2200, 2200); blob.vy = clamp(mouse.vy, -2200, 2200); blob.grounded = false; }
  blob.dragging = false; mouse.pin = null; mouse.col = null; mouse.grab = null; cv.classList.remove("drag");
});
cv.addEventListener("wheel", (e) => {                         // DEBUG MODE: WHEEL OVER A COLLIDER CIRCLE RESIZES IT
  if (!ui.debug) return;
  const m = toWorld(e), a = worldToArt(m.x, m.y); let best = -1, bd = 1e9;
  COLLIDERS_ART.forEach((c, i) => { const d = Math.hypot(a.x - c.x, a.y - c.y); if (d < c.r && d < bd) { bd = d; best = i; } });
  if (best < 0) return; e.preventDefault();
  const c = COLLIDERS_ART[best]; c.r = Math.max(4, Math.min(300, c.r + (e.deltaY < 0 ? 2 : -2)));
}, { passive: false });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* =====================================================================
   UPDATE
   ===================================================================== */
function flipFacing(newF) {
  if (blob.facing === newF) return;
  const axis = blob.x;
  blob.facing = newF;
  if (C.turnMode === "mirror") { blob.faceS = newF; capeMirror(cape, axis); cape.last = pinsWorld(); blob.turnT = C.turnTime > 0 ? 0 : 1; } // WHOLE CHAIN FLIPS WITH THE ART
  else if (C.turnMode === "slide" && C.turnTime > 0) { blob.turnFrom = blob.faceS; blob.turnT = 0; }                                     // faceS GLIDES -1..1, SO THE PIN SLIDES THROUGH THE BODY
  else { blob.faceS = newF; blob.turnT = 1; }                                                                                          // SNAP
}

function update(dt) {
  if (mouse.pin) { const a = worldToArt(mouse.x, mouse.y); PIN[mouse.pin + "x"] = Math.round(clamp(a.x, 0, ART.w) * 2) / 2; PIN[mouse.pin + "y"] = Math.round(clamp(a.y, 0, ART.h) * 2) / 2; syncUI(); }
  if (mouse.col !== null && COLLIDERS_ART[mouse.col]) { const a = worldToArt(mouse.x, mouse.y), c = COLLIDERS_ART[mouse.col]; c.x = Math.round(clamp(a.x, 0, ART.w)); c.y = Math.round(clamp(a.y, 0, ART.h)); }
  const inp = getInput(dt);

  if (blob.dragging) {
    const tx = mouse.x + mouse.grab.x, ty = mouse.y + mouse.grab.y;
    const nvx = (tx - blob.x) / Math.max(dt, 1e-3), nvy = (ty - blob.y) / Math.max(dt, 1e-3);
    mouse.vx = lerp(mouse.vx, nvx, 0.35); mouse.vy = lerp(mouse.vy, nvy, 0.35);
    blob.x = tx; blob.y = Math.min(ty, groundY); blob.vx = mouse.vx; blob.vy = mouse.vy; blob.grounded = false;
    if (Math.abs(mouse.vx) > 120) flipFacing(mouse.vx > 0 ? 1 : -1);
  } else {
    const top = B.maxSpeed * (inp.dash ? B.dashMul : 1), ctl = blob.grounded ? 1 : B.airCtl;
    if (inp.dir) {
      flipFacing(inp.dir);
      if (Math.abs(blob.vx) > top && Math.sign(blob.vx) === inp.dir) blob.vx -= Math.sign(blob.vx) * Math.min(Math.abs(blob.vx) - top, B.friction * dt);   // THROWN FASTER THAN TOP SPEED: EASE DOWN TO IT
      else { blob.vx += inp.dir * B.accel * ctl * dt; if (inp.dir * blob.vx > top) blob.vx = inp.dir * top; }
    } else if (blob.grounded) {
      const f = B.friction * dt; blob.vx = Math.abs(blob.vx) <= f ? 0 : blob.vx - Math.sign(blob.vx) * f;
    } else blob.vx *= Math.max(0, 1 - 0.4 * dt);
    if (inp.jumpPressed && blob.grounded) { blob.vy = -B.jumpV; blob.grounded = false; blob.sq = 0.26; }
    if (!inp.jumpHeld && blob.vy < -300) blob.vy *= Math.max(0, 1 - 9 * dt); // RELEASE EARLY = SHORT HOP
    blob.vy += B.gravity * dt;
    blob.x += blob.vx * dt; blob.y += blob.vy * dt;
    if (blob.y >= groundY) {
      if (!blob.grounded && blob.vy > 250) blob.sq = -Math.min(0.34, blob.vy / 3400);
      blob.y = groundY; blob.vy = 0; blob.grounded = true;
    }
  }
  blob.sqv += (-260 * blob.sq - 16 * blob.sqv) * dt; blob.sq += blob.sqv * dt;   // SQUASH SPRING
  if (blob.turnT < 1) blob.turnT = C.turnTime > 0 ? Math.min(1, blob.turnT + dt / C.turnTime) : 1;

    edgeB.push({ x: sp.x - nx * dn, y: sp.y - ny * dn });    // BOTTOM EDGE
  }
  ctx.lineJoin = "round";
  const quad = (p0, p1, q1, q0, col) => { ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(q1.x, q1.y); ctx.lineTo(q0.x, q0.y); ctx.closePath(); ctx.fill(); ctx.stroke(); };
  const cT = hexRGB(L.top), cB = hexRGB(L.bottom), cD = hexRGB(L.dark);
  for (let i = 0; i < n - 1; i++) {
    const s = i / (n - 2);
    const fold = clamp(foldAt(cape.p, i) / 0.7, 0, 1);       // DARKEN WHERE THE CLOTH BENDS HARD
    const cTop = css(mixA(mixA(cT, cD, s * 0.25), cD, fold * 0.55));
    const cBot = css(mixA(mixA(cB, cD, s * 0.45), cD, fold * 0.55));
    quad(edgeA[i], edgeA[i + 1], mid[i + 1], mid[i], cTop);
    quad(mid[i], mid[i + 1], edgeB[i + 1], edgeB[i], cBot);

    ctx.strokeStyle = L.dark; ctx.beginPath();
    edgeB.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();

function drawStrip() { // 2 PINS: THE CAPE IS THE CLOTH BETWEEN TWO EDGE CHAINS, SO ITS ROOT EDGE IS EXACTLY THE PINK-MARKER EDGE OF THE CLOAK
  const A = cape.chains[0].p, Bp = cape.chains[1].p, n = A.length;
  if (n < 3) return;
  const mid = A.map((a, i) => ({ x: lerp(a.x, Bp[i].x, L.split), y: lerp(a.y, Bp[i].y, L.split) }));
  let sg = 0; for (let i = 0; i < n - 1; i++) sg += Math.sign(quadArea(A, Bp, i)); const s0 = sg >= 0 ? 1 : -1;   // MAJORITY ORIENTATION
  ctx.lineJoin = "round";

  const cT = hexRGB(L.top), cB = hexRGB(L.bottom), cD = hexRGB(L.dark);
  for (let i = 0; i < n - 1; i++) {
    const s = i / (n - 2);
    const fold = clamp((foldAt(A, i) + foldAt(Bp, i)) / 2 / 0.7, 0, 1);
    const back = quadArea(A, Bp, i) * s0 < 0 ? 0.6 : 0;      // A TWISTED-OVER QUAD SHOWS ITS BACK SIDE (DARKER) INSTEAD OF POPPING
    const cTop = css(mixA(mixA(mixA(cT, cD, s * 0.25), cD, fold * 0.55), cD, back));
    const cBot = css(mixA(mixA(mixA(cB, cD, s * 0.45), cD, fold * 0.55), cD, back));
    quad(A[i], A[i + 1], mid[i + 1], mid[i], cTop);
    quad(mid[i], mid[i + 1], Bp[i + 1], Bp[i], cBot);
  }
  if (L.folds) {
    ctx.strokeStyle = "rgba(10,0,40,.22)"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const fr of [0.3, 0.8]) for (let i = 0; i < n; i++) { const x = lerp(A[i].x, Bp[i].x, fr), y = lerp(A[i].y, Bp[i].y, fr); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

    ctx.lineCap = "round"; ctx.strokeStyle = L.rim; ctx.lineWidth = L.rimW; ctx.beginPath();
    A.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.strokeStyle = L.dark; ctx.beginPath();
    Bp.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(A[n - 1].x, A[n - 1].y); ctx.lineTo(Bp[n - 1].x, Bp[n - 1].y); ctx.stroke();
  }
}

function drawBlob() {
  const k = B.scale, sx = 1 - blob.sq * 0.6, sy = 1 + blob.sq;

}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawBackground();                                          // SCREEN SPACE (IT DOES ITS OWN SCROLLING FROM cam.x)
  ctx.save(); ctx.translate(-Math.round(cam.x), 0);
  ctx.save();
  if (C.turnMode === "mirror" && blob.turnT < 1) { const e = blob.turnT * blob.turnT * (3 - 2 * blob.turnT), s = lerp(-1, 1, e); ctx.translate(blob.x, 0); ctx.scale(s, 1); ctx.translate(-blob.x, 0); } // TURN SQUASH: OLD FACING -> THIN -> NEW FACING

// BODY LOADING. A CHARACTER BODY = library view image + character.json "cape" block (SEE BRIEFME STEP 10).
function applyBody(b) {
  bodyId = b.id; Object.assign(ART, b.art); ART.box = b.box.slice();
  COLLIDERS_ART.length = 0; for (const c of b.colliders) COLLIDERS_ART.push({ x: c.x, y: c.y, r: c.r });

  const d = b.defaults || (b.id === BUILTIN_ID ? { scale: DEFAULTS.B.scale, segLen: DEFAULTS.C.segLen, segments: DEFAULTS.C.segments, w1: DEFAULTS.L.w1, hangDeg: DEFAULTS.C.hangDeg } : null);
  if (d) { if (d.scale) B.scale = d.scale; if (d.segLen) C.segLen = d.segLen; if (d.segments) C.segments = d.segments; if (d.w1) L.w1 = d.w1; if (d.hangDeg != null) C.hangDeg = d.hangDeg; }

  if (b.sim && b.sim.C) { Object.assign(C, b.sim.C); if (b.sim.L) Object.assign(L, b.sim.L); if (b.sim.scale > 0) B.scale = b.sim.scale; }   // THE SIM SETTINGS PLAY IS USING FOR THIS CHARACTER (SAVED BY "SAVE CAPE TO CHARACTER")
  document.getElementById("bodyName").textContent = String(b.name || b.id).toUpperCase();

function measureArt(url) { // SIZE, OPAQUE BOUNDING BOX AND FEET PIVOT (CENTRE OF THE LOWEST 30 ROWS) OF A VIEW PNG
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight, c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 16) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) { rej(new Error("EMPTY_IMAGE: the view has no visible pixels")); return; }
      let f0 = w, f1 = -1; for (let y = Math.max(y0, y1 - 30); y <= y1; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 16) { if (x < f0) f0 = x; if (x > f1) f1 = x; }
      res({ w, h, box: [x0, y0, x1, y1], px: Math.round((f0 + f1) / 2), py: y1 });
    };
    im.onerror = () => rej(new Error("BAD_IMAGE")); im.src = url;
  });
}
async function loadBody(id) {

  try {
    const sheet = await OSWClient.library.character.get(id), cp = (sheet && sheet.cape) || {}, view = cp.view || "right";
    if (cp.space === "sprite") {                          // SAVED FROM NOVA2: THE PINS ARE IN SPRITE-SHEET PIXELS, SO SHOW THEM ON THE NOVA2 ART, NOT THE 800 PX VIEW
      const old = bodyObjUrl; bodyObjUrl = null; if (old) URL.revokeObjectURL(old);
      applyBody({ id, name: (sheet && sheet.info && sheet.info.name) || id, src: BODY_SRC, art: BUILTIN_BODY.art, box: BUILTIN_BODY.box, colliders: (cp.colliders && cp.colliders.length) ? cp.colliders : BUILTIN_BODY.colliders, pins: cp.pins || BUILTIN_BODY.pins, defaults: cp.defaults || null, sim: cp.sim || null, space: "sprite" });
      flash("BODY: " + id.toUpperCase() + " (SPRITE SPACE)"); return true;
    }
    const png = await OSWClient.library.readImage(id + "." + view), url = URL.createObjectURL(png), m = await measureArt(url);
    const bw = m.box[2] - m.box[0], bh = m.box[3] - m.box[1], cx = (m.box[0] + m.box[2]) / 2;
    const pins = cp.pins || { ax: Math.round(m.box[0] + bw * 0.04), ay: Math.round(m.box[1] + bh * 0.16), bx: Math.round(m.box[0] + bw * 0.06), by: Math.round(m.box[1] + bh * 0.34) };
    const cols = (cp.colliders && cp.colliders.length) ? cp.colliders : [{ x: Math.round(cx), y: Math.round(m.box[1] + bh * 0.11), r: Math.round(bh * 0.08) }, { x: Math.round(cx), y: Math.round(m.box[1] + bh * 0.37), r: Math.round(bh * 0.07) }];
    const old = bodyObjUrl; bodyObjUrl = url;
    applyBody({ id, name: (sheet && sheet.info && sheet.info.name) || id, src: url, art: { w: m.w, h: m.h, px: m.px, py: m.py }, box: m.box, colliders: cols, pins, defaults: cp.defaults || null, sim: cp.sim || null, space: "view" });
    if (old) URL.revokeObjectURL(old);
    flash(cp.pins ? "BODY: " + id.toUpperCase() : "NO CAPE PINS SAVED FOR " + id.toUpperCase() + " YET - PRESS G AND DRAG THEM, THEN SAVE CAPE TO CHARACTER");
    return true;
  } catch (e) { flash("COULD NOT LOAD BODY " + id + ": " + String((e && e.message) || e).replace(/^[A-Z_]+: /, "")); if (bodySel) bodySel.value = bodyId; return false; }
}
async function savePinsToCharacter() {   // WRITES THE PINS, BODY COLLIDERS AND THE WHOLE SIM + LOOK SETTINGS INTO THE CHARACTER'S SHEET. PLAY READS THEM FROM THERE, SO IT UPDATES LIVE.
  const builtin = bodyId === BUILTIN_ID, target = builtin ? (targetSel && targetSel.value) : bodyId;
  if (!target) { flash("PICK THE CHARACTER TO SAVE TO (THE LIST UNDER THE BODY LIST)"); return; }
  try {
    const sheet = await OSWClient.library.character.get(target); if (!sheet) { flash("NO CHARACTER SHEET FOR " + target); return; }
    const prev = sheet.cape || {}, space = bodySpace, clone = (o) => JSON.parse(JSON.stringify(o));

    if (space === "sprite" && !play.ref) play.ref = { x: (PIN.ax + PIN.bx) / 2, y: (PIN.ay + PIN.by) / 2 };   // FIRST SAVE IN SPRITE SPACE: PLAY'S HAND-TUNED POSE ROOTS STAY WHERE THEY ARE NOW; MOVING THE PINS LATER MOVES THEM BY THE DIFFERENCE
    sheet.cape = Object.assign({}, prev, { version: 2, view: prev.view || "right", space, pins: { ax: PIN.ax, ay: PIN.ay, bx: PIN.bx, by: PIN.by }, colliders: COLLIDERS_ART.map((c) => ({ x: c.x, y: c.y, r: c.r })),
      defaults: { scale: B.scale, segLen: C.segLen, segments: C.segments, w1: L.w1, hangDeg: C.hangDeg },
      sim: { scale: B.scale, C: clone(C), L: clone(L) } });   // prev KEEPS BLOCKS OTHER TOOLS OWN (play: {...} IS PLAY'S). sim.scale = THE BODY SCALE THE NUMBERS WERE TUNED AT, SO PLAY CAN CONVERT THEM
    if (space === "sprite") sheet.cape.art = { px: ART.px, py: ART.py }; else delete sheet.cape.art;
    if (Object.keys(play).length) sheet.cape.play = play; else delete sheet.cape.play;
    await OSWClient.library.character.save(target, sheet); if (!builtin) bodyPins = { ...sheet.cape.pins }; flash("CAPE SAVED TO " + target.toUpperCase() + " - PLAY UPDATES LIVE");
  } catch (e) { flash("SAVE FAILED: " + String((e && e.message) || e).replace(/^[A-Z_]+: /, "")); }
}

function buildLibrary() { // ONLY WHEN HOSTED IN THE WIZARD
  if (!(window.OSWClient && OSWClient.hosted)) return;
  const s = section("Library (Wizard)", true); s.id = "lib";
  panel.insertBefore(s, panel.children[1] || null);   // RIGHT UNDER PRESETS, NOT BURIED AT THE BOTTOM
  hint(s, "SAVES THE CAPE SETTINGS TO library/capes/<name>.json SO PLAY AND THE CHARACTER CAN USE THEM LATER.");
  hint(s, "BODY: NOVA2 (THE BUILT-IN TEST BODY, AT PLAY'S SPRITE SCALE) OR A CHARACTER'S SIDE VIEW. SAVE CAPE TO CHARACTER WRITES THE PINS, BODY COLLIDERS AND ALL THE SIM / LOOK SETTINGS INTO A CHARACTER'S SHEET (character.json); PLAY RUNS THE SAME SIM ON THEM. WHEN THE BODY IS NOVA2, THE SECOND LIST PICKS WHICH CHARACTER GETS THEM.");
  bodySel = document.createElement("select"); bodySel.id = "bodySel"; s.appendChild(bodySel);
  targetSel = document.createElement("select"); targetSel.id = "saveTarget"; targetSel.title = "WHICH CHARACTER 'SAVE CAPE TO CHARACTER' WRITES TO WHEN THE BODY IS NOVA2"; s.appendChild(targetSel);
  OSWClient.library.character.list().then((names) => {
    bodySel.innerHTML = ""; for (const n of [BUILTIN_ID, ...names]) { const o = document.createElement("option"); o.value = o.textContent = n; bodySel.appendChild(o); } bodySel.value = bodyId;
    targetSel.innerHTML = ""; for (const n of names) { const o = document.createElement("option"); o.value = n; o.textContent = "save to: " + n; targetSel.appendChild(o); }
    if (names.includes("nova")) targetSel.value = "nova";
  }).catch(() => {});
  bodySel.addEventListener("change", () => loadBody(bodySel.value));
  const bb = document.createElement("div"); bb.className = "btns"; s.appendChild(bb);
  button(bb, "SAVE CAPE TO CHARACTER", savePinsToCharacter);
  const nm = document.createElement("input"); nm.type = "text"; nm.id = "libName"; nm.maxLength = 40; nm.placeholder = "cape name (a-z 0-9 - _)"; s.appendChild(nm);
  const sel = document.createElement("select"); sel.id = "libSel";
  const fill = async (keep) => {
    let names = []; try { names = await OSWClient.library.cape.list(); } catch (e) { /* EMPTY LIST */ }
    sel.innerHTML = ""; for (const n of names) { const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o); }
    if (keep && names.includes(keep)) sel.value = keep;
  };
  const bs = document.createElement("div"); bs.className = "btns"; s.appendChild(bs);
  button(bs, "SAVE TO LIBRARY", async () => {
    const name = nm.value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    if (!name) { flash("NAME THE CAPE FIRST"); return; }
    try { await OSWClient.library.cape.save(name, settingsObject()); nm.value = name; await fill(name); flash("SAVED TO LIBRARY: " + name); }
    catch (e) { flash("SAVE FAILED: " + (e && e.message || e)); }
  });
  s.appendChild(sel);
  const b2 = document.createElement("div"); b2.className = "btns"; s.appendChild(b2);
  button(b2, "LOAD FROM LIBRARY", async () => {
    const n = sel.value; if (!n) { flash("NO LIBRARY CAPES YET"); return; }
    try { const o = await OSWClient.library.cape.get(n); if (applySettings(o)) { nm.value = n; flash("LOADED " + n); } else flash("NOT A CAPE LAB FILE"); }
    catch (e) { flash("LOAD FAILED"); }
  });
  fill(); OSWClient.on("library.changed", (c) => { if (c && c.kind === "cape") fill(); });
}

  select(s, L, "mode", "cape render", [["tendrils", "body + tendrils"], ["strip", "solid strip"]]);

  check(s, L, "dis", "dissolve on");

  s = section("Body");

}
buildPanel(); buildLibrary(); restoreSaved(); setInterval(saveSoon, 2000); document.getElementById("panel").addEventListener("input", saveSoon); document.getElementById("panel").addEventListener("change", saveSoon);

/* =====================================================================
   LOOP (+ A SMALL HANDLE FOR TESTING: lab.advance(seconds) RUNS THE SIM WITHOUT DRAWING)
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const raw = Math.min(0.05, (now - last) / 1000); last = now;
  ui.fps = lerp(ui.fps, 1 / Math.max(raw, 1e-4), 0.05);
  if (!ui.paused) { update(raw * ui.timeScale); sparksStep(raw * ui.timeScale); tendrilStep(raw * ui.timeScale); }
  draw();
  if (((now / 100) | 0) !== frame.h) { frame.h = (now / 100) | 0; updateHUD(); }
  requestAnimationFrame(frame);
}
window.lab = { B, C, L, PIN, blob, cape, ui, peak, update, applyPreset, resetAll, clearPeaks, capeMetrics, keys,
  advance(sec, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) update(dt); } };
resize(); resetAll();
requestAnimationFrame(frame);
</script>
